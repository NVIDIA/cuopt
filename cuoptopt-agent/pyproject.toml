[build-system]
requires = ["setuptools>=43", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuoptopt-agent"
version = "0.1.0"
description = "Agentic optimization loop for NVIDIA cuOpt — searches literature, implements improvements, validates, and opens PRs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # CLI
    "typer>=0.12",
    "rich>=13",
    # LLM backends
    "anthropic>=0.28",
    "openai>=1.30",           # also used for NVIDIA NIM (OpenAI-compatible)
    # Research
    "scholarly>=1.7",
    "arxiv>=2.1",
    # GitHub integration
    "PyGithub>=2.3",
    # Config & data models
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # Diff application
    "unidiff>=0.7",
    # Dashboard
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
cuoptopt-agent = "cuoptopt_agent.main:app"
cuoptopt-dashboard = "dashboard.server:start"

[tool.setuptools.packages.find]
where = ["."]
include = ["cuoptopt_agent*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py310"
