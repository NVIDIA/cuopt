#
# Field registry for auto-generating proto definitions and C++ conversion code.
#
# Convention-over-configuration. Each entry under scalars: / arrays: can be
# written in any of three forms (see parse_field in generate_conversions.py):
#   - Bare name           – defaults to double for scalars, repeated double for arrays
#   - "name: type"        – specified type
#   - "name: { type: T, ... }" – full override
#
# Default getters: scalars → get_<name>(); arrays → get_<name>_host() (both
#   problem and solution arrays).
# Default setters: set_<name>().
# Proto field name = registry field name (always).
# Enum conventions: see the "Enums" section below for full defaults.
#
# Field numbers:
#   field_num  – proto message field tag (scoped to its proto message). Used
#                  by the unary path (SubmitJob / GetResult), where the whole
#                  problem or solution fits in one proto message.
#   array_id   – enum value for ArrayFieldId (problem) or ResultFieldId
#                  (solution + warm-start). Used by the chunked path
#                  (SendArrayChunk / GetResultChunk) to route each chunk back
#                  to the right array — independent of any proto message.
#
# Both are normally assigned manually. Passing --auto-number to the generator
# fills in missing values. Without --auto-number, a fully-stripped registry is
# an error and a partially-stripped one will silently emit broken code for
# the unassigned entries.
#
# Numbering is contiguous within each proto message (no artificial caps).
# The only hard ranges are for solution scalars that share ChunkedResultHeader:
#   LP:  1000-1999
#   MIP: 2000-2999
#   WS:  3000-3999
#
# Attributes (all optional unless noted):
#
# Per-field:
#   description        – human-readable meaning of the field. Emitted into
#                          cuopt_mcp_schema.json as the JSON Schema
#                          `description`, which is what an MCP client shows a
#                          model deciding whether to set the field. Consumed
#                          for settings sections only.
#   default            – what the field does when omitted, written as a string
#                          describing the C++ member initializer (e.g. "1e-4",
#                          "-1 (automatic)"). Appended to the emitted
#                          description as "Default: ...". Documentation only —
#                          the generator neither derives nor validates it, and
#                          it does not affect the wire format. Take the value
#                          from the C++ struct, not from docs/: the two are
#                          known to disagree.
#   param_name         – the CUOPT_* string parameter this field corresponds
#                          to, when it differs from the field name (the field
#                          name is the *proto* name; MIP diverges heavily —
#                          relative_mip_gap vs mip_relative_gap, mir_cuts vs
#                          mip_mixed_integer_rounding_cuts). Emitted into the
#                          MCP schema as "x-parameter-name". Set it explicitly
#                          to `null` for a field with no CUOPT_* constant at
#                          all: it stays on the wire but is dropped from the
#                          MCP schema, since set_parameter would reject it.
#                          python/cuopt_mcp/tests/test_parameter_names.py
#                          asserts every advertised name exists in constants.h.
#   type               – proto wire type (default: double for scalars, repeated double for arrays)
#   field_num          – proto message field number (see "Field numbers" above)
#   array_id           – enum value for ArrayFieldId or ResultFieldId
#   setter_getter_root – C++ getter/setter root when different from field name
#   getter             – explicit C++ getter expression (overrides setter_getter_root)
#   setter             – explicit C++ setter name
#   member             – C++ member name or access path (when different from field name)
#   setter_group       – name of multi-argument setter group
#   conditional        – true => guard serialization with emptiness check
#   skip_conversion    – true => include in proto but not in conversion code
#   proto_only         – true => include in proto header but not a constructor arg
#   sentinel           – sentinel value handling for fields with "unset" semantics
#   optional           – true => emit proto3 `optional` (presence-tracked) and
#                          only apply the value when the client explicitly set it.
#                          Use for scalar fields whose C++ default differs from the
#                          proto3 zero value (e.g. `bool foo{true}`), so that an
#                          omitted field preserves the solver default instead of
#                          silently overwriting it with the proto3 zero. Composes
#                          with `sentinel` (optional guards the omitted case;
#                          sentinel keeps the existing wire encoding for "explicit
#                          default" values). Also valid on enum-typed fields whose
#                          proto3 zero (the first listed value) does not match the
#                          documented C++ default — e.g. pdlp_solver_mode.
#   from_proto_cast    – explicit cast type for proto -> C++ direction
#                        (e.g. wrapping a wire int32 into an enum class).
#                        When set, the matching to-proto cast back to the
#                        wire's C++ type is auto-derived from `type:`, so
#                        the symmetric pair is captured by this one knob.
#   to_proto_cast      – escape hatch: explicit cast type for C++ -> proto
#                        direction.  Only needed when the auto-derivation
#                        above is wrong; otherwise omit it.
#
# Per-section:
#   cpp_type           – C++ type this section maps to
#   constructor_args   – mapping of constructor parameter names to field sources
#   presence_check     – predicate expression to test if optional data is present
#   getter             – (per-section) expression to access the section's C++ data
#   embeds             – list of submessages embedded as fields (e.g. PDLPWarmStartData)
#   proto_type         – fully-qualified C++ proto type (settings sections)
#   proto_message      – proto message name (optimization_problem)
#   fields             – list of fields (settings sections; supports nested sub-structs)
#   setter_groups      – multi-array C++ setters keyed by group name (optimization_problem)
#
# Warm-start sub-section adds:
#   result_id_prefix      – prefix for derived RESULT_<PREFIX>_<NAME> ids
#   chunked_header_prefix – prefix applied to scalar field names in ChunkedResultHeader
#
# See GRPC_CODE_GENERATION.md for the full specification and examples.

# ─────────────────────────────────────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────────────────────────────────────
#
# Attributes (override any field explicitly when needed):
#   domain        — required: one of `problem`, `settings`, `solution`. Controls
#                    which generated_enum_converters_*.inc file the converters
#                    land in.
#   cpp_type      — {key}_t
#   proto_type    — PascalCase from key (acronyms PDLP/MIP/LP/QP/VRP/PDP uppercased)
#   to_proto_fn   — to_proto_{key}()
#   from_proto_fn — from_proto_{key}()
#   default       — first value (proto3 zero-value)
#   values        — bare names auto-number from 0; {Name: N} resets counter to N
#   proto_prefix  — "" (no prefix); set when proto values need disambiguation
#   aliases       — optional mapping of additional enum value names to numeric
#                    ids; used by the auto-derived `result_field_id` enum to
#                    preserve legacy abbreviated names alongside canonical ones
#
# Proto value names: proto_prefix + UPPER_SNAKE(CppName), or just CppName if
# no prefix.
#

# yamllint disable rule:indentation

enums:
  pdlp_termination_status:
    domain: solution
    proto_prefix: PDLP
    values:
    - NoTermination
    - NumericalError
    - Optimal
    - PrimalInfeasible
    - DualInfeasible
    - IterationLimit
    - TimeLimit
    - ConcurrentLimit
    - PrimalFeasible

  mip_termination_status:
    domain: solution
    proto_prefix: MIP
    values:
    - NoTermination
    - Optimal
    - FeasibleFound
    - Infeasible
    - Unbounded
    - TimeLimit
    - WorkLimit

  pdlp_solver_mode:
    domain: settings
    default: Stable3
    values:
    - Stable1
    - Stable2
    - Methodical1
    - Fast1
    - Stable3

  lp_method:
    domain: settings
    cpp_type: method_t
    values:
    - Concurrent
    - PDLP
    - DualSimplex
    - Barrier

  variable_type:
    domain: problem
    cpp_type: var_t
    values:
    - CONTINUOUS
    - INTEGER
    - SEMI_CONTINUOUS

  problem_category:
    domain: problem
    values:
    - LP
    - MIP

  # ResultFieldId is auto-derived from solution/warm-start array_id fields.
  # Aliases here preserve backward compatibility with upstream's abbreviated
  # legacy names while the codegen uses full, consistent canonical names.
  result_field_id:
    aliases:
      RESULT_WS_CURRENT_PRIMAL: 3
      RESULT_WS_CURRENT_DUAL: 4
      RESULT_WS_INITIAL_PRIMAL_AVG: 5
      RESULT_WS_INITIAL_DUAL_AVG: 6
      RESULT_WS_SUM_PRIMAL: 8
      RESULT_WS_SUM_DUAL: 9
      RESULT_WS_LAST_RESTART_GAP_PRIMAL: 10
      RESULT_WS_LAST_RESTART_GAP_DUAL: 11

# ─────────────────────────────────────────────────────────────────────────────
# LP Solution
# ─────────────────────────────────────────────────────────────────────────────
lp_solution:
  cpp_type: "cpu_lp_solution_t<i_t, f_t>"
  # Submessages embedded as fields in LPSolution. Tags are pinned here (rather
  # than auto-numbered) so they stay stable across proto schema churn; the
  # auto-numberer reserves them out of the arrays/scalars pool.
  embeds:
    - name: warm_start_data
      type: PDLPWarmStartData
      field_num: 4

  scalars:
  - lp_termination_status:
      field_num: 1000
      type: pdlp_termination_status
      getter: get_termination_status()
  - error_message:
      field_num: 1001
      type: string
      getter: "get_error_status().what()"
      proto_only: true
  - l2_primal_residual:
      field_num: 1002
  - l2_dual_residual:
      field_num: 1003
  - primal_objective:
      field_num: 1004
      getter: get_objective_value()
  - dual_objective:
      field_num: 1005
      getter: get_dual_objective_value()
  - gap:
      field_num: 1006
  - nb_iterations:
      field_num: 1007
      type: int32
      getter: get_num_iterations()
  - solve_time:
      field_num: 1008
  - solved_by:
      field_num: 1009
      type: int32
      getter: solved_by()
      from_proto_cast: method_t

  arrays:
  - primal_solution:
      field_num: 1
      array_id: 0
  - dual_solution:
      field_num: 2
      array_id: 1
  - reduced_cost:
      field_num: 3
      array_id: 2

  constructor_args:
    scalars:
    - lp_termination_status
    - primal_objective
    - dual_objective
    - solve_time
    - l2_primal_residual
    - l2_dual_residual
    - gap
    - nb_iterations
    - solved_by

  warm_start:
    presence_check: has_warm_start_data()
    getter: get_cpu_pdlp_warm_start_data()
    result_id_prefix: WS
    chunked_header_prefix: ws_

    scalars:
    - initial_primal_weight:
        field_num: 3000
        member: initial_primal_weight_
    - initial_step_size:
        field_num: 3001
        member: initial_step_size_
    - total_pdlp_iterations:
        field_num: 3002
        type: int32
        member: total_pdlp_iterations_
    - total_pdhg_iterations:
        field_num: 3003
        type: int32
        member: total_pdhg_iterations_
    - last_candidate_kkt_score:
        field_num: 3004
        member: last_candidate_kkt_score_
    - last_restart_kkt_score:
        field_num: 3005
        member: last_restart_kkt_score_
    - sum_solution_weight:
        field_num: 3006
        member: sum_solution_weight_
    - iterations_since_last_restart:
        field_num: 3007
        type: int32
        member: iterations_since_last_restart_

    arrays:
    - current_primal_solution:
        field_num: 1
        array_id: 3
        member: current_primal_solution_
    - current_dual_solution:
        field_num: 2
        array_id: 4
        member: current_dual_solution_
    - initial_primal_average:
        field_num: 3
        array_id: 5
        member: initial_primal_average_
    - initial_dual_average:
        field_num: 4
        array_id: 6
        member: initial_dual_average_
    - current_ATY:
        field_num: 5
        array_id: 7
        member: current_ATY_
    - sum_primal_solutions:
        field_num: 6
        array_id: 8
        member: sum_primal_solutions_
    - sum_dual_solutions:
        field_num: 7
        array_id: 9
        member: sum_dual_solutions_
    - last_restart_duality_gap_primal_solution:
        field_num: 8
        array_id: 10
        member: last_restart_duality_gap_primal_solution_
    - last_restart_duality_gap_dual_solution:
        field_num: 9
        array_id: 11
        member: last_restart_duality_gap_dual_solution_

# ─────────────────────────────────────────────────────────────────────────────
# MIP Solution
# ─────────────────────────────────────────────────────────────────────────────
mip_solution:
  cpp_type: "cpu_mip_solution_t<i_t, f_t>"

  scalars:
  - mip_termination_status:
      field_num: 2000
      type: mip_termination_status
      getter: get_termination_status()
  - mip_error_message:
      field_num: 2001
      type: string
      getter: "get_error_status().what()"
      proto_only: true
  - mip_objective:
      field_num: 2002
      getter: get_objective_value()
  - mip_gap:
      field_num: 2003
  - solution_bound:
      field_num: 2004
  - total_solve_time:
      field_num: 2005
      getter: get_solve_time()
  - presolve_time:
      field_num: 2006
  - max_constraint_violation:
      field_num: 2007
  - max_int_violation:
      field_num: 2008
  - max_variable_bound_violation:
      field_num: 2009
  - nodes:
      field_num: 2010
      type: int32
      getter: get_num_nodes()
  - simplex_iterations:
      field_num: 2011
      type: int32
      getter: get_num_simplex_iterations()

  arrays:
  - mip_solution:
      field_num: 1
      array_id: 12
      getter: get_solution_host()

  constructor_args:
    scalars:
    - mip_termination_status
    - mip_objective
    - mip_gap
    - solution_bound
    - total_solve_time
    - presolve_time
    - max_constraint_violation
    - max_int_violation
    - max_variable_bound_violation
    - nodes
    - simplex_iterations

# ─────────────────────────────────────────────────────────────────────────────
# Chunked Result Header
# ─────────────────────────────────────────────────────────────────────────────
# Synthetic message assembled from lp_solution + mip_solution scalars and
# warm-start scalars at codegen time. The only thing the registry needs to
# carry for it is the list of embedded submessages.
#
chunked_result_header:
  embeds:
    - name: arrays
      type: ResultArrayDescriptor
      field_num: 50
      repeated: true

# ─────────────────────────────────────────────────────────────────────────────
# PDLP Solver Settings
# ─────────────────────────────────────────────────────────────────────────────
#
# Settings use nested YAML to mirror C++ struct hierarchy.
# A list-valued entry is a sub-struct group (e.g. tolerances).
#
pdlp_settings:
  cpp_type: "pdlp_solver_settings_t<i_t, f_t>"
  proto_type: "cuopt::remote::PDLPSolverSettings"
  # Submessages embedded as fields in PDLPSolverSettings. See lp_solution.embeds.
  embeds:
    - name: warm_start_data
      type: PDLPWarmStartData
      field_num: 50

  fields:
    # Termination tolerances (nested: settings.tolerances.<field>)
  - tolerances:
    - absolute_gap_tolerance:
        description: >-
          Absolute term in PDLP's duality gap check:
          duality_gap < absolute_gap_tolerance + relative_gap_tolerance *
          (|primal_objective| + |dual_objective|).
        default: "1e-4"
        field_num: 1
        optional: true
    - relative_gap_tolerance:
        description: >-
          Relative term in PDLP's duality gap check; multiplies
          (|primal_objective| + |dual_objective|). Significant impact on
          accuracy and runtime.
        default: "1e-4"
        field_num: 2
        optional: true
    - primal_infeasible_tolerance:
        description: >-
          Tolerance used when PDLP declares the problem primal infeasible.
          Only consulted when detect_infeasibility is enabled.
        default: "1e-10"
        field_num: 3
        optional: true
    - dual_infeasible_tolerance:
        description: >-
          Tolerance used when PDLP declares the problem dual infeasible
          (unbounded). Only consulted when detect_infeasibility is enabled.
        default: "1e-10"
        field_num: 4
        optional: true
    - absolute_dual_tolerance:
        description: >-
          Absolute term in PDLP's dual feasibility check:
          dual_feasibility < absolute_dual_tolerance + relative_dual_tolerance
          * l2_norm(c).
        default: "1e-4"
        field_num: 5
        optional: true
    - relative_dual_tolerance:
        description: >-
          Relative term in PDLP's dual feasibility check; multiplies the
          objective vector L2 norm.
        default: "1e-4"
        field_num: 6
        optional: true
    - absolute_primal_tolerance:
        description: >-
          Absolute term in PDLP's primal feasibility check:
          primal_feasibility < absolute_primal_tolerance +
          relative_primal_tolerance * l2_norm(b).
        default: "1e-4"
        field_num: 7
        optional: true
    - relative_primal_tolerance:
        description: >-
          Relative term in PDLP's primal feasibility check; multiplies the
          right-hand-side vector L2 norm.
        default: "1e-4"
        field_num: 8
        optional: true

    # Limits
  - time_limit:
      description: >-
        Wall-clock limit in seconds after which the solver stops and returns
        the current solution. Checked periodically rather than continuously,
        so the solver may run slightly over. When set together with
        iteration_limit, the first limit reached wins.
      default: "no limit (infinity)"
      field_num: 9
      optional: true
  - iteration_limit:
      # C++ default is `std::numeric_limits<i_t>::max()`. Two presence
      # mechanisms compose here: `sentinel` keeps the existing wire encoding
      # (max() <=> -1, preserving 26.04 compatibility) and `optional` adds the
      # missing piece — an omitted field would otherwise decode to the wire
      # zero (0), which is `>= 0` and would overwrite the C++ default with 0.
      description: >-
        Iteration limit after which the solver stops and returns the current
        solution. Checked periodically, so the solver may run a few extra
        iterations. When set together with time_limit, the first limit reached
        wins.
      default: "no limit (INT_MAX)"
      field_num: 10
      type: int64
      sentinel: max_as_negative_1
      optional: true

    # Solver configuration
  - log_to_console:
      description: >-
        Whether the solver writes log output to the console. Logs may still be
        written to a file when this is false.
      default: "true"
      field_num: 11
      type: bool
      optional: true
  - detect_infeasibility:
      param_name: infeasibility_detection
      description: >-
        Whether PDLP attempts to detect infeasibility. Detection is not always
        accurate — some problems reported infeasible converge under a different
        tolerance — and costs roughly 3-7% runtime and 10-20% memory. Dual
        simplex always detects infeasibility regardless of this setting.
      default: "false"
      field_num: 12
      type: bool
  - strict_infeasibility:
      description: >-
        When true, PDLP stops if either the current or the average solution is
        detected infeasible. When false, both must be detected infeasible.
      default: "false"
      field_num: 13
      type: bool
  - pdlp_solver_mode:
      # C++ default is `Stable3` (enum value 4). The proto3 enum zero is
      # `Stable1` (the first value declared), so without `optional` an
      # omitted field would silently apply `Stable1` instead of the cuOpt
      # default. Declared `optional` so the mapper preserves the C++
      # default via `has_pdlp_solver_mode()`.
      description: >-
        Mode under which PDLP operates; changes how the problem is internally
        optimized and can drastically change solve time. Stable3 is the best
        overall mode from cuOpt experiments; Methodical1 takes slower but fewer
        steps at 1.3-1.7x the memory; Fast1 is fastest but converges less
        often. There is no way to know upfront which mode suits a given
        problem — testing is encouraged.
      default: "Stable3"
      field_num: 14
      type: pdlp_solver_mode
      optional: true
  - method:
      description: >-
        Method used to solve the LP. Concurrent runs PDLP, dual simplex and
        barrier in parallel. Default accuracy differs per method: PDLP 1e-4
        relative, barrier 1e-8 relative, dual simplex 1e-6 absolute.
      default: "Concurrent"
      field_num: 15
      type: lp_method
  - presolver:
      param_name: presolve
      description: >-
        Which presolver performs presolve reductions: 0 disables presolve,
        1 selects Papilo, 2 selects PSLP. By default LP uses PSLP and MIP uses
        Papilo.
      default: "Default (PSLP for LP, Papilo for MIP)"
      field_num: 16
      type: int32
      from_proto_cast: "presolver_t"
      optional: true
  - dual_postsolve:
      # C++ default is `true`; using proto3 `optional` so that a client that
      # omits this field gets the solver default rather than the proto3 zero
      # (`false`). See also the matching `optional` markers on
      # `barrier_iterative_refinement` (pdlp) and `probing` (mip).
      description: >-
        Whether dual postsolve runs when the Papilo presolver is used on an LP.
        Disabling it can improve solve time at the cost of losing access to the
        dual solution. Not relevant for MIP.
      default: "true"
      field_num: 17
      type: bool
      optional: true
  - crossover:
      description: >-
        Whether PDLP or barrier crosses over to a basic solution after reaching
        optimality. PDLP and barrier solutions need not lie at a vertex;
        crossover yields a basic solution with n - m variables on their bounds.
        Significant impact on accuracy and runtime.
      default: "false"
      field_num: 18
      type: bool
  - num_gpus:
      description: >-
        Number of GPUs used for the solve. Relevant to LP in concurrent mode
        (up to 2 GPUs), where PDLP and barrier run on separate GPUs rather than
        sharing one. For distributed PDLP, -1 selects all visible devices.
      default: "1"
      field_num: 19
      type: int32
      optional: true

  - per_constraint_residual:
      description: >-
        Whether PDLP computes primal and dual residuals per constraint instead
        of globally.
      default: "false"
      field_num: 20
      type: bool
  - cudss_deterministic:
      description: >-
        Whether cuDSS runs in deterministic mode. Deterministic mode makes
        results reproducible across runs but may be slower.
      default: "false"
      field_num: 21
      type: bool
  - folding:
      description: >-
        Barrier: whether to fold the LP, reducing problem size by exploiting
        symmetry. -1 automatic, 0 disabled, 1 forced.
      default: "-1 (automatic)"
      field_num: 22
      type: int32
      optional: true
  - augmented:
      description: >-
        Barrier: which linear system to solve at each iteration. -1 automatic,
        0 the ADAT system (normal equations), 1 the augmented system. The
        augmented system can be more stable, ADAT is often faster.
      default: "-1 (automatic)"
      field_num: 23
      type: int32
      optional: true
  - dualize:
      description: >-
        Barrier: whether presolve dualizes the LP, which can help problems with
        inequality constraints that have more constraints than variables.
        -1 automatic, 0 disabled, 1 forced.
      default: "-1 (automatic)"
      field_num: 24
      type: int32
      optional: true
  - ordering:
      description: >-
        Barrier: ordering algorithm cuDSS uses for sparse factorizations, which
        can significantly affect runtime. -1 automatic, 0 cuDSS default
        ordering, 1 AMD (approximate minimum degree).
      default: "-1 (automatic)"
      field_num: 25
      type: int32
      optional: true
  - barrier_dual_initial_point:
      description: >-
        Barrier: how the dual initial point is computed, which affects the
        iteration count. -1 automatic, 0 the Lustig-Marsten-Shanno heuristic,
        1 a least-squares problem minimizing the norms of the dual variables
        and reduced costs subject to the dual equality constraints.
      default: "-1 (automatic)"
      field_num: 26
      type: int32
      optional: true
  - eliminate_dense_columns:
      description: >-
        Barrier: whether dense columns are eliminated from the constraint
        matrix before solving, reducing factorization fill-in at the cost of
        extra solves per iteration. Only has an effect when the ADAT (normal
        equation) system is solved.
      default: "true"
      field_num: 27
      type: bool
      optional: true
  - barrier_iterative_refinement:
      # Whether the barrier method runs iterative refinement after each solve
      # (see cpp/src/barrier/barrier.cu). C++ default is `true`. Declared as
      # proto3 `optional` so that a client which omits this field preserves
      # the solver default; without `optional`, the proto3 wire zero (`false`)
      # would silently overwrite the C++ default.
      description: >-
        Barrier: whether iterative refinement runs after each barrier solve to
        improve solution accuracy (see cpp/src/barrier/barrier.cu).
      default: "true"
      field_num: 31
      type: bool
      optional: true
  - barrier_step_scale:
      # Step scale used by the barrier method primal/dual updates. Local-solve
      # binding restricts the range to [0.5, 0.9999] with default 0.9; see
      # solver_settings.cu. No post-decode clamp is applied here for
      # consistency with the other f_t scalars (tolerances, time_limit, ...).
      description: >-
        Barrier: scaling factor applied to the primal/dual step size. Must be
        strictly less than 1 — 0.9 is conservative, 0.999 aggressive. The
        local-solve binding restricts the range to [0.5, 0.9999]; this field is
        not clamped after decoding, for consistency with the other float
        scalars.
      default: "0.9"
      field_num: 32
      optional: true
  - postsolve_info:
      # No user-facing documentation exists for this field yet (it is absent
      # from docs/cuopt/source/convex-settings.rst); only the C++ default is
      # recorded here. Add a `description:` once the behavior is documented.
      default: "-1"
      field_num: 33
      type: int32
      optional: true
  - save_best_primal_so_far:
      description: >-
        Whether PDLP keeps the best primal solution seen so far. When enabled,
        a primal feasible iterate always beats an infeasible one; among
        feasible iterates the best primal objective wins; among infeasible
        ones the lowest primal residual wins, breaking ties on objective.
      default: "false"
      field_num: 28
      type: bool
  - first_primal_feasible:
      description: >-
        Whether the solver stops as soon as a primal feasible iterate is found,
        without waiting for optimality or dual feasibility. Composable with
        per_constraint_residual.
      default: "false"
      field_num: 29
      type: bool
  - pdlp_precision:
      description: >-
        Precision mode for the PDLP solver. DefaultPrecision uses the problem's
        native precision; SinglePrecision runs PDHG in FP32 (half the memory,
        roughly 2x faster iterations, possibly more of them); DoublePrecision
        forces FP64; MixedPrecision stores the constraint matrix in FP32 for
        faster SpMV while keeping vectors and compute in FP64 (convergence
        checks still use the FP64 matrix, so memory is not reduced).
      default: "DefaultPrecision"
      field_num: 30
      type: int32
      from_proto_cast: "pdlp_precision_t"
      optional: true

# ─────────────────────────────────────────────────────────────────────────────
# MIP Solver Settings
# ─────────────────────────────────────────────────────────────────────────────
mip_settings:
  cpp_type: "mip_solver_settings_t<i_t, f_t>"
  proto_type: "cuopt::remote::MIPSolverSettings"

  fields:
    # Limits
  - time_limit:
      description: >-
        Wall-clock limit in seconds after which the solver stops and returns
        the best solution found so far. When set together with node_limit or
        work_limit, the first limit reached wins.
      default: "no limit (infinity)"
      field_num: 1
      optional: true

    # Tolerances (nested: settings.tolerances.<field>)
  - tolerances:
    - relative_mip_gap:
        param_name: mip_relative_gap
        description: >-
          Relative gap at which the solve terminates:
          abs(best_objective - dual_bound) / abs(best_objective). The gap is
          zero when both are zero, and infinite when only the best objective
          is zero.
        default: "1e-4"
        field_num: 2
        optional: true
    - absolute_mip_gap:
        param_name: mip_absolute_gap
        description: >-
          Absolute gap at which the solve terminates: best_objective -
          dual_bound when minimizing, dual_bound - best_objective when
          maximizing.
        default: "1e-10"
        field_num: 3
        optional: true
    - integrality_tolerance:
        param_name: mip_integrality_tolerance
        description: >-
          How close to an integer a variable must be to count as integral.
        default: "1e-5"
        field_num: 4
        optional: true
    - absolute_tolerance:
        param_name: mip_absolute_tolerance
        description: MIP absolute tolerance.
        default: "1e-6"
        field_num: 5
        optional: true
    - relative_tolerance:
        param_name: mip_relative_tolerance
        description: MIP relative tolerance.
        default: "1e-12"
        field_num: 6
        optional: true
    - presolve_absolute_tolerance:
        # Not settable through cuOpt's string parameter API (no CUOPT_*
        # constant in constants.h), so it is omitted from the MCP schema.
        param_name: null
        # No user-facing documentation exists for this field yet (it is absent
        # from docs/cuopt/source/mip-settings.rst); only the C++ default is
        # recorded here. Add a `description:` once the behavior is documented.
        default: "1e-6"
        field_num: 7
        optional: true

    # Solver configuration
  - log_to_console:
      description: >-
        Whether the solver writes log output to the console. Logs may still be
        written to a file when this is false.
      default: "true"
      field_num: 8
      type: bool
      optional: true
  - heuristics_only:
      param_name: mip_heuristics_only
      description: >-
        When true only the GPU heuristics run, improving the primal bound
        alone. When false both GPU and CPU are used and the dual bound is
        improved on the CPU.
      default: "false"
      field_num: 9
      type: bool
  - num_cpu_threads:
      description: >-
        Number of CPU threads used by the MIP solver. Lower values cap cuOpt's
        CPU footprint; higher values speed up the CPU-parallel parts. -1
        derives the count from the number of CPU cores.
      default: "-1 (automatic)"
      field_num: 10
      type: int32
      optional: true
  - num_gpus:
      description: Number of GPUs used for the solve.
      default: "1"
      field_num: 11
      type: int32
      optional: true
  - presolver:
      param_name: presolve
      description: >-
        Which presolver performs presolve reductions: 0 disables presolve,
        1 selects Papilo, 2 selects PSLP. MIP uses Papilo by default.
      default: "Default (Papilo for MIP)"
      field_num: 12
      type: int32
      from_proto_cast: "presolver_t"
      optional: true
  - mip_scaling:
      description: >-
        Whether scaling is applied to the MIP problem. 0 off, 1 on, 2 applied
        but not to the objective.
      default: "2 (no objective scaling)"
      field_num: 13
      type: int32
      optional: true
  - symmetry:
      param_name: mip_symmetry
      # Symmetry-detection level (dejavu). Valid: -1 (default), 0 (off),
      # 1 (orbital fixing), 2 (orbital fixing + lexical reduction). The
      # mapper clamps out-of-range values to -1 to match the local-solve
      # range check in cpp/src/math_optimization/solver_settings.cu.
      description: >-
        Symmetry detection and handling. -1 automatic, 0 disabled, 1 orbital
        fixing, 2 orbital fixing plus lexical reduction.
      default: "-1 (automatic)"
      field_num: 33
      type: int32
      optional: true

    # Additional limits
  - work_limit:
      description: >-
        Limit in work units — a machine-independent measure of solver effort —
        after which the solver stops and returns the current solution. When set
        together with time_limit or node_limit, the first limit reached wins.
      default: "no limit (infinity)"
      field_num: 14
      optional: true
  - node_limit:
      # C++ default `max()`. See iteration_limit for the rationale on
      # composing `sentinel` with `optional` (sentinel for the explicit
      # wire-encoded "default" value, optional for the omitted-field case).
      description: >-
        Maximum number of branch-and-bound nodes explored before the solver
        stops and returns the best feasible solution found, if any. When set
        together with time_limit, the first limit reached wins.
      default: "no limit (INT_MAX)"
      field_num: 15
      type: int32
      sentinel: max_as_negative_1
      optional: true

    # Branching
  - reliability_branching:
      param_name: mip_reliability_branching
      description: >-
        Reliability branching mode. -1 automatic (the solver picks whether to
        use it and with what factor), 0 disabled, k > 0 enables it and treats a
        variable as reliable once it has been branched on k times.
      default: "-1 (automatic)"
      field_num: 16
      type: int32
      optional: true
  - mip_batch_pdlp_strong_branching:
      description: >-
        Whether strong branching at the root evaluates candidates with a single
        batched PDLP solve instead of solving them in parallel with dual
        simplex, which can cut strong-branching time when dual simplex
        struggles. 0 disabled, 1 enabled.
      default: "0 (disabled)"
      field_num: 17
      type: int32
  - mip_batch_pdlp_reliability_branching:
      description: >-
        Whether reliability-branching candidates are evaluated simultaneously
        with a single batched PDLP solve. 0 disabled, 1 enabled.
      default: "0 (disabled)"
      field_num: 32
      type: int32
  - strong_branching_simplex_iteration_limit:
      param_name: mip_strong_branching_simplex_iteration_limit
      description: >-
        Maximum simplex iterations per candidate during strong branching.
        Lowering it speeds up strong branching at the cost of less accurate
        candidate evaluations.
      default: "-1 (automatic)"
      field_num: 30
      type: int32
      optional: true

    # Cut configuration
    # The individual cut-family toggles (mir_cuts, mixed_integer_gomory_cuts,
    # knapsack_cuts, clique_cuts, zero_half_cuts, implied_bound_cuts,
    # strong_chvatal_gomory_cuts) share the same tri-state contract:
    # -1 automatic, 0 disabled, 1 enabled.
  - max_cut_passes:
      param_name: mip_cut_passes
      description: >-
        Maximum number of cut passes to run. 0 disables cuts entirely; larger
        values perform more passes.
      default: "10"
      field_num: 18
      type: int32
      optional: true
  - mir_cuts:
      param_name: mip_mixed_integer_rounding_cuts
      description: >-
        Whether mixed-integer rounding cuts are used. -1 automatic (the solver
        decides from problem characteristics), 0 disabled, 1 enabled.
      default: "-1 (automatic)"
      field_num: 19
      type: int32
      optional: true
  - mixed_integer_gomory_cuts:
      param_name: mip_mixed_integer_gomory_cuts
      description: >-
        Whether mixed-integer Gomory cuts are used. -1 automatic, 0 disabled,
        1 enabled.
      default: "-1 (automatic)"
      field_num: 20
      type: int32
      optional: true
  - knapsack_cuts:
      param_name: mip_knapsack_cuts
      description: >-
        Whether knapsack cuts are used. -1 automatic, 0 disabled, 1 enabled.
      default: "-1 (automatic)"
      field_num: 21
      type: int32
      optional: true
  - clique_cuts:
      param_name: mip_clique_cuts
      description: >-
        Whether clique cuts are used. -1 automatic, 0 disabled, 1 enabled.
      default: "-1 (automatic)"
      field_num: 22
      type: int32
      optional: true
  - zero_half_cuts:
      param_name: mip_zero_half_cuts
      description: >-
        Whether zero-half cuts are used. -1 automatic, 0 disabled, 1 enabled.
      default: "-1 (automatic)"
      field_num: 52
      type: int32
      optional: true
  - implied_bound_cuts:
      param_name: mip_implied_bound_cuts
      description: >-
        Whether implied bound cuts are used. -1 automatic, 0 disabled,
        1 enabled.
      default: "-1 (automatic)"
      field_num: 31
      type: int32
      optional: true
  - strong_chvatal_gomory_cuts:
      param_name: mip_strong_chvatal_gomory_cuts
      description: >-
        Whether strong Chvatal-Gomory cuts are used. -1 automatic, 0 disabled,
        1 enabled.
      default: "-1 (automatic)"
      field_num: 23
      type: int32
      optional: true
  - reduced_cost_strengthening:
      param_name: mip_reduced_cost_strengthening
      description: >-
        Whether integer feasible solutions are used to strengthen integer
        variable bounds. -1 automatic, 0 disabled, 1 during the root cut
        passes, 2 during the root cut passes and after strong branching.
      default: "-1 (automatic)"
      field_num: 24
      type: int32
      optional: true
  - cut_change_threshold:
      param_name: mip_cut_change_threshold
      description: >-
        Required improvement in the dual bound per cut pass. Larger values
        demand significant improvement each pass; -1 lets cut passes continue
        even without improvement.
      default: "-1 (no threshold)"
      field_num: 25
      optional: true
  - cut_min_orthogonality:
      param_name: mip_cut_min_orthogonality
      description: >-
        Minimum orthogonality a cut needs to be added to the LP relaxation.
        Values near 1 require cuts to be nearly orthogonal to each other;
        values near 0 admit more cuts.
      default: "0.5"
      field_num: 26
      optional: true

    # Determinism and reproducibility
  - determinism_mode:
      param_name: mip_determinism_mode
      description: >-
        0 opportunistic — results may vary between runs due to parallelism.
        1 deterministic — improves reproducibility across runs with the same
        thread count. Deterministic mode is experimental and does not yet
        guarantee fully deterministic results in every scenario.
      default: "0 (opportunistic)"
      field_num: 27
      type: int32
  - seed:
      param_name: random_seed
      description: >-
        Random seed. A fixed seed gives reproducible results when running in
        deterministic mode.
      default: "-1 (chosen automatically)"
      field_num: 28
      type: int32
      optional: true

    # Presolve sub-steps
  - probing:
      param_name: mip_probing
      # C++ default is `true`; declared as proto3 `optional` so that a client
      # which omits this field preserves the solver default. Without
      # `optional`, the proto3 wire zero (`false`) would silently overwrite
      # the C++ default. See also `dual_postsolve` and
      # `barrier_iterative_refinement` in pdlp_settings.
      description: >-
        Whether the probing-cache step of MIP presolve runs. Probing evaluates
        variable fixings to discover implications later used by branch-and-bound
        and the rounding heuristics. Only meaningful when presolve is otherwise
        enabled — presolver=0 disables the whole pipeline. Probing is also
        skipped in deterministic mode and on LP-only solves.
      default: "true"
      field_num: 29
      type: bool
      optional: true

    # Semi-continuous variables
    # Fallback upper bound for semi-continuous variables when bounds-strengthening
    # cannot derive a finite UB. Local-solve binding restricts the range to
    # [1.0, +inf] with default 1e10; see solver_settings.cu.
  - semi_continuous_big_m:
      param_name: mip_semi_continuous_big_m
      description: >-
        Big-M coefficient used when linearizing semi-continuous variable
        constraints (such a variable is either zero or lies in
        [lower_bound, upper_bound]). Should be at least as large as the upper
        bound of any semi-continuous variable in the problem. Serves as the
        fallback upper bound when bounds-strengthening cannot derive a finite
        one. The local-solve binding restricts the range to [1.0, +inf].
      default: "1e10"
      field_num: 34
      optional: true

    # MIP heuristic hyper-parameters (nested: settings.heuristic_params.<field>)
    # Tuning knobs for MIP GPU heuristics; see mip_heuristics_hyper_params_t
    # in cpp/include/cuopt/mathematical_optimization/mip/heuristics_hyper_params.hpp.
    # All fields carry non-zero defaults on the C++ side, so they are declared
    # `optional` in the proto: a client that omits any of them gets the C++
    # default rather than the proto3 wire zero (0).
    # These are internal tuning knobs with no user-facing documentation page;
    # the descriptions below are taken from the declaring comments in
    # heuristics_hyper_params.hpp rather than from docs/.
  - heuristic_params:
    - population_size:
        param_name: mip_hyper_heuristic_population_size
        description: Maximum number of solutions held in the solution pool.
        default: "32"
        field_num: 35
        type: int32
        optional: true
    - num_cpufj_threads:
        param_name: mip_hyper_heuristic_num_cpufj_threads
        description: Number of parallel CPU Feasibility Jump climbers.
        default: "8"
        field_num: 36
        type: int32
        optional: true
    # 37 and 38 held presolve_time_ratio and presolve_max_time, removed when
    # presolve stopped taking a wall budget. Do not reuse: an older client
    # still sends them on those numbers.
    - root_lp_time_ratio:
        param_name: mip_hyper_heuristic_root_lp_time_ratio
        description: Fraction of the total time budget given to the root LP.
        default: "0.1"
        field_num: 39
        optional: true
    - root_lp_max_time:
        param_name: mip_hyper_heuristic_root_lp_max_time
        description: Hard cap in seconds on the root LP solve.
        default: "15.0"
        field_num: 40
        optional: true
    - rins_time_limit:
        param_name: mip_hyper_heuristic_rins_time_limit
        description: Per-call time budget in seconds for the RINS sub-MIP.
        default: "3.0"
        field_num: 41
        optional: true
    - rins_max_time_limit:
        param_name: mip_hyper_heuristic_rins_max_time_limit
        description: >-
          Ceiling in seconds on the adaptive RINS time budget.
        default: "20.0"
        field_num: 42
        optional: true
    - rins_fix_rate:
        param_name: mip_hyper_heuristic_rins_fix_rate
        description: Fraction of variables RINS fixes before solving the sub-MIP.
        default: "0.5"
        field_num: 43
        optional: true
    - stagnation_trigger:
        param_name: mip_hyper_heuristic_stagnation_trigger
        description: >-
          Number of Feasibility Pump loops without improvement before
          recombination is triggered.
        default: "3"
        field_num: 44
        type: int32
        optional: true
    - max_iterations_without_improvement:
        param_name: mip_hyper_heuristic_max_iterations_without_improvement
        description: Depth of the diversity step taken after stagnation.
        default: "8"
        field_num: 45
        type: int32
        optional: true
    - initial_infeasibility_weight:
        param_name: mip_hyper_heuristic_initial_infeasibility_weight
        description: Seed value for the constraint violation penalty.
        default: "1000.0"
        field_num: 46
        optional: true
    - n_of_minimums_for_exit:
        param_name: mip_hyper_heuristic_n_of_minimums_for_exit
        description: >-
          Number of local minima after which the Feasibility Jump baseline
          exits.
        default: "7000"
        field_num: 47
        type: int32
        optional: true
    - enabled_recombiners:
        param_name: mip_hyper_heuristic_enabled_recombiners
        description: >-
          Bitmask of enabled recombiners: 1 bound propagation, 2 feasibility
          pump, 4 local search, 8 sub-MIP.
        default: "15 (all enabled)"
        field_num: 48
        type: int32
        optional: true
    - cycle_detection_length:
        param_name: mip_hyper_heuristic_cycle_detection_length
        description: >-
          Size of the ring buffer used to detect Feasibility Pump assignment
          cycles.
        default: "30"
        field_num: 49
        type: int32
        optional: true
    - relaxed_lp_time_limit:
        param_name: mip_hyper_heuristic_relaxed_lp_time_limit
        description: >-
          Base time cap in seconds for relaxed LP solves inside the heuristics.
        default: "1.0"
        field_num: 50
        optional: true
    - related_vars_time_limit:
        param_name: mip_hyper_heuristic_related_vars_time_limit
        description: >-
          Time in seconds allowed for building the related-variable structure.
        default: "30.0"
        field_num: 51
        optional: true
    - presolve_max_rounds:
        param_name: mip_hyper_heuristic_presolve_max_rounds
        description: >-
          Cap on Papilo presolve rounds. A value <= 0 removes the cap entirely.
        default: "-1 (no override)"
        field_num: 53
        type: int32
        optional: true
    - papilo_probing_max_badgesize:
        param_name: mip_hyper_heuristic_papilo_probing_max_badgesize
        description: Ceiling on Papilo's probing.minbadgesize.
        default: "-1 (no override)"
        field_num: 54
        type: int32
        optional: true

# ─────────────────────────────────────────────────────────────────────────────
# Optimization Problem (cpu_optimization_problem_t)
# ─────────────────────────────────────────────────────────────────────────────
optimization_problem:
  cpp_type: "cpu_optimization_problem_t<i_t, f_t>"
  proto_message: OptimizationProblem

  scalars:
  - problem_name:
      field_num: 1
      type: string
  - objective_name:
      field_num: 2
      type: string
  - maximize:
      field_num: 3
      type: bool
      getter: get_sense()
  - objective_scaling_factor:
      field_num: 4
      # C++ defaults to 1 while an absent proto3 scalar reads as 0. Track
      # presence so external clients may omit the field without changing the
      # objective to an unsupported zero scaling factor.
      optional: true
  - objective_offset:
      field_num: 5

  arrays:
  - variable_names:
      field_num: 7
      array_id: 0
      type: repeated string
  - row_names:
      field_num: 8
      array_id: 1
      type: repeated string
  - A_values:
      field_num: 9
      array_id: 2
      setter_getter_root: constraint_matrix_values
      setter_group: csr_constraint_matrix
  - A_indices:
      field_num: 10
      array_id: 3
      setter_getter_root: constraint_matrix_indices
      type: repeated int32
      setter_group: csr_constraint_matrix
  - A_offsets:
      field_num: 11
      array_id: 4
      setter_getter_root: constraint_matrix_offsets
      type: repeated int32
      setter_group: csr_constraint_matrix
  - c:
      field_num: 12
      array_id: 5
      setter_getter_root: objective_coefficients
  - b:
      field_num: 13
      array_id: 6
      setter_getter_root: constraint_bounds
      conditional: true
  - variable_lower_bounds:
      field_num: 14
      array_id: 7
  - variable_upper_bounds:
      field_num: 15
      array_id: 8
  - constraint_lower_bounds:
      field_num: 16
      array_id: 9
      conditional: true
  - constraint_upper_bounds:
      field_num: 17
      array_id: 10
      conditional: true
  - row_types:
      field_num: 18
      array_id: 11
      type: bytes
      conditional: true
  - variable_types:
      field_num: 19
      array_id: 12
      type: repeated variable_type
  - initial_primal_solution:
      field_num: 20
      array_id: 13
      skip_conversion: true
  - initial_dual_solution:
      field_num: 21
      array_id: 14
      skip_conversion: true
  - Q_values:
      field_num: 22
      array_id: 15
      setter_getter_root: quadratic_objective_values
      setter_group: quadratic_objective
  - Q_indices:
      field_num: 23
      array_id: 16
      setter_getter_root: quadratic_objective_indices
      type: repeated int32
      setter_group: quadratic_objective
  - Q_offsets:
      field_num: 24
      array_id: 17
      setter_getter_root: quadratic_objective_offsets
      type: repeated int32
      setter_group: quadratic_objective

  setter_groups:
    csr_constraint_matrix:
      setter: set_csr_constraint_matrix
      fields: [A_values, A_indices, A_offsets]
    quadratic_objective:
      setter: set_quadratic_objective_matrix
      fields: [Q_values, Q_indices, Q_offsets]

  # Quadratic constraints (QCQP).  Each entry is a row with its own RHS plus
  # the row's linear coefficients (linear_values/linear_indices) and the COO
  # representation of the Q matrix (rows/cols/vals as three parallel arrays).
  #
  # Why a repeated message rather than a flat shared structure (as we use for
  # linear constraints)?  Linear constraints fold together into a single CSR
  # triple A_values / A_indices / A_offsets — three top-level arrays sized by
  # nnz(A), independent of row count.  Quadratic constraints can't fold the
  # same way: each row has its own independent Q matrix with no shared
  # sparsity pattern, so the natural wire shape is one message per row with
  # the row's per-entry arrays nested inside it.
  #
  # That nesting is why these arrays need the container-chunk path rather
  # than the flat top-level chunk path.  Top-level arrays are chunked under a
  # single (array_id) key; container arrays sit inside a repeated field and
  # are chunked under (container_field_num, container_index, field_id) — the
  # extra container_index disambiguates which repeated entry the chunk
  # belongs to.  See ArrayChunk in cuopt_remote_data.proto.
  #
  # Per-entry arrays are unbounded in size so they travel via container chunks
  # (container_field_num=25, container_index=<entry idx>, field_id=<0..4>).
  # Per-entry scalars travel inline in the parent message (OptimizationProblem
  # in the unary path; ChunkedProblemHeader in the chunked path).
  #
  # `constraint_row_type` is `char` in cpu_optimization_problem_t but rides
  # the wire as int32 (proto3 has no `char`).  Decode is intentionally lenient
  # — any int32 round-trips back as a char without range validation, matching
  # how the local-solve binding accepts whatever the C++ caller supplies.
  repeated_messages:
  - quadratic_constraints:
      field_num: 25
      message_type: QuadraticConstraint
      cpp_inner_type: "typename cpu_optimization_problem_t<i_t, f_t>::quadratic_constraint_t"
      presence_check: has_quadratic_constraints()
      getter: get_quadratic_constraints()
      setter: set_quadratic_constraints
      scalars:
      - constraint_row_index:
          field_num: 1
          type: int32
      - constraint_row_name:
          field_num: 2
          type: string
      - constraint_row_type:
          field_num: 3
          type: int32
          from_proto_cast: char
      - rhs_value:
          field_num: 4
      arrays:
      - linear_values:
          field_num: 5
          array_id: 0
      - linear_indices:
          field_num: 6
          array_id: 1
          type: repeated int32
      - rows:
          field_num: 7
          array_id: 2
          type: repeated int32
      - cols:
          field_num: 8
          array_id: 3
          type: repeated int32
      - vals:
          field_num: 9
          array_id: 4
      # Companion-array length invariants enforced on decode.  Each [values,
      # indices] pair must have equal size, mirroring the top-level
      # setter_groups check (e.g., set_csr_constraint_matrix).  A mismatch
      # throws std::invalid_argument before set_quadratic_constraints sees the
      # row, so a malformed client cannot land an inconsistent QC entry in the
      # solver.
      companion_pairs:
        - [linear_values, linear_indices]
        - [rows, cols]
        - [cols, vals]
