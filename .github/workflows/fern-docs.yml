name: Fern Docs

on:
  push:
    branches:
      - docs-fern-migration
    paths:
      - "docs/cuopt/source/**"
      - "fern/**"
      - ".github/workflows/fern-docs.yml"
  pull_request:
    paths:
      - "docs/cuopt/source/**"
      - "fern/**"
  workflow_dispatch:

jobs:
  convert-and-check:
    name: Convert RST → MDX and fern check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Install fern CLI
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Re-generate MDX from RST sources
        run: python fern/convert_docs.py

      - name: fern check
        run: fern check
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

  publish:
    name: Publish to Fern
    runs-on: ubuntu-latest
    needs: convert-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/docs-fern-migration'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Install fern CLI
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Re-generate MDX from RST sources
        run: python fern/convert_docs.py

      - name: Publish docs
        run: fern generate --docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
