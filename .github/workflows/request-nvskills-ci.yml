# Triggered when a maintainer/admin comments `/nvskills-ci` on a PR
# touching skills/. The bot pushes a signature commit that must remain
# in the PR before merge. Fork-based PRs are supported once
# `allow_fork_pull_requests: true` is set for this repository in the
# NVSkills CI onboarding config.

name: Request NVSkills CI

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  require-nvskills-ci:
    name: "NVSkills CI (non-blocking)"
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: NVIDIA/skills/.github/workflows/require-nvskills-status.yml@main

  request:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/nvskills-ci')) ||
      (github.event_name == 'push' &&
        github.actor == (vars.NVSKILLS_SIGNATURE_PUSH_ACTOR || 'nv-skills-ci[bot]') &&
        startsWith(github.event.head_commit.message, vars.NVSKILLS_SIGNATURE_COMMIT_TITLE || 'Attach NVSkills validation signatures'))
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: NVIDIA/skills/.github/workflows/team-request.yml@main
    secrets:
      NVSKILLS_CI_DISPATCH_TOKEN: ${{ secrets.NVSKILLS_CI_DISPATCH_TOKEN }}
