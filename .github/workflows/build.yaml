name: build

on:
  push:
    branches:
      - "branch-*"
    tags:
      - v[0-9][0-9].[0-9][0-9].[0-9][0-9]
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
        description: "Branch to build"
      date:
        required: true
        type: string
        description: "Build date"
      sha:
        required: true
        type: string
        description: "Commit SHA to build"
      build_type:
        type: string
        default: nightly
        description: "Type of build (nightly, branch, etc.)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-build:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      script: ci/build_cpp.sh
  python-build:
    needs: [cpp-build]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      script: ci/build_python.sh
  upload-conda:
    needs: [cpp-build, python-build]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/conda-upload-packages.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
  wheel-build-cuopt-mps-parser:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      script: ci/build_wheel_cuopt_mps_parser.sh
      package-name: cuopt_mps_parser
      package-type: python
      append-cuda-suffix: false
  wheel-publish-cuopt-mps-parser:
    needs: wheel-build-cuopt-mps-parser
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cuopt_mps_parser
      package-type: python
  wheel-build-libcuopt:
    needs: wheel-build-cuopt-mps-parser
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      script: ci/build_wheel_libcuopt.sh
      package-name: libcuopt
      package-type: cpp
      matrix_filter: group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))
  wheel-publish-libcuopt:
    needs: wheel-build-libcuopt
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: libcuopt
      package-type: cpp
  wheel-build-cuopt:
    needs: [wheel-build-cuopt-mps-parser, wheel-build-libcuopt]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      script: ci/build_wheel_cuopt.sh
      package-name: cuopt
      package-type: python
  wheel-publish-cuopt:
    needs: wheel-build-cuopt
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cuopt
      package-type: python
  wheel-build-cuopt-server:
    needs: wheel-build-cuopt
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      script: ci/build_wheel_cuopt_server.sh
      package-name: cuopt_server
      package-type: python
  wheel-publish-cuopt-server:
    needs: wheel-build-cuopt-server
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cuopt_server
      package-type: python
  docs-build:
    needs: [python-build]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      node_type: "gpu-l4-latest-1"
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      arch: "amd64"
      file_to_upload: "docs/cuopt/build/html/"
      artifact-name: "cuopt_docs"
      container_image: "rapidsai/ci-conda:25.10-latest"
      script: "ci/build_docs.sh"
  wheel-build-cuopt-sh-client:
    needs: wheel-build-cuopt
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      script: ci/build_wheel_cuopt_sh_client.sh
      package-name: cuopt_sh_client
      package-type: python
      append-cuda-suffix: false
  wheel-publish-cuopt-sh-client:
    needs: wheel-build-cuopt-sh-client
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@branch-25.10
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cuopt_sh_client
      package-type: python
  build-images:
    needs: [wheel-publish-cuopt, wheel-publish-cuopt-server]
    uses: ./.github/workflows/build_test_publish_images.yaml
    secrets: inherit
    with:
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      build_type: ${{ inputs.build_type || 'branch' }}
  check-failures:
    if: always()
    runs-on: ubuntu-latest
    needs: [cpp-build, python-build, upload-conda, wheel-build-cuopt-mps-parser, wheel-publish-cuopt-mps-parser, wheel-build-libcuopt, wheel-publish-libcuopt, wheel-build-cuopt, wheel-publish-cuopt, wheel-build-cuopt-server, wheel-publish-cuopt-server, docs-build, wheel-build-cuopt-sh-client, wheel-publish-cuopt-sh-client, build-images]
    outputs:
      has-failures: ${{ steps.check-failures.outputs.has-failures }}
      failed-jobs: ${{ steps.check-failures.outputs.failed-jobs }}
      failed-jobs-formatted: ${{ steps.format-failed-jobs.outputs.failed-jobs-formatted }}
      is-cancelled: ${{ steps.check-failures.outputs.is-cancelled }}
      job-results: ${{ steps.check-failures.outputs.job-results }}
    steps:
      - name: Check for Failures
        id: check-failures
        run: |
          # Extract job names from needs context automatically
          needs_json='${{ toJson(needs) }}'
          job_names=$(echo "$needs_json" | jq -r 'keys[]')

          failed_jobs=()
          has_failures=false

          # Check each job for failures
          while IFS= read -r job; do
            result=$(echo "$needs_json" | jq -r --arg job "$job" '.[$job].result // "unknown"')
            if [[ "$result" == "failure" ]]; then
              failed_jobs+=("$job")
              has_failures=true
            fi
          done <<< "$job_names"

          # Log failed jobs
          if [[ "$has_failures" == "true" ]]; then
            echo "has-failures=true" >> $GITHUB_OUTPUT
            echo "failed-jobs=${failed_jobs[*]}" >> $GITHUB_OUTPUT
          else
            echo "has-failures=false" >> $GITHUB_OUTPUT
            echo "failed-jobs=" >> $GITHUB_OUTPUT
          fi

          # Check if workflow was manually cancelled
          if [[ "${{ github.event.head_commit.message }}" == *"[skip ci]"* ]] ||
             [[ "${{ github.event.head_commit.message }}" == *"[ci skip]"* ]]; then
            echo "is-cancelled=true" >> $GITHUB_OUTPUT
          else
            echo "is-cancelled=false" >> $GITHUB_OUTPUT
          fi

      - name: Format Failed Jobs List
        id: format-failed-jobs
        if: steps.check-failures.outputs.has-failures == 'true'
        run: |
          # Format failed jobs list with bullet points
          if [[ -n "${{ steps.check-failures.outputs.failed-jobs }}" ]]; then
            failed_jobs_formatted=$(echo "${{ steps.check-failures.outputs.failed-jobs }}" | tr ' ' '\n' | sed 's/^/• /' | tr '\n' '\n')
            echo "failed-jobs-formatted<<EOF" >> $GITHUB_OUTPUT
            echo "$failed_jobs_formatted" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "failed-jobs-formatted=" >> $GITHUB_OUTPUT
          fi

  failure-notification:
    if: always()
    needs: [check-failures]
    uses: ./.github/workflows/failure-notification.yaml
    with:
      repository: ${{ github.repository }}
      branch: ${{ inputs.branch || github.ref_name }}
      commit_sha: ${{ inputs.sha || github.sha }}
      build_type: ${{ inputs.build_type || 'branch' }}
      workflow_run_id: ${{ github.run_id }}
      workflow_run_number: ${{ github.run_number }}
      commit_timestamp: ${{ github.event.head_commit.timestamp }}
      commit_message: ${{ github.event.head_commit.message }}
      has_failures: ${{ needs.check-failures.outputs.has-failures == 'true' }}
      failed_jobs: ${{ needs.check-failures.outputs.failed-jobs }}
      failed_jobs_formatted: ${{ needs.check-failures.outputs.failed-jobs-formatted }}
      is_cancelled: ${{ needs.check-failures.outputs.is-cancelled == 'true' }}
    secrets: inherit
