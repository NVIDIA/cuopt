#
# Publishes a bundle of Maven artifacts (jars, POMs, sources, javadoc). Every
# file is GPG-signed. The destination is chosen inside this workflow with
# `rapids-is-release-build`:
#   - release build (vYY.MM.PP tag) -> Maven Central via the Sonatype Central
#     Publisher Portal (OSSRH staging + validation, human-gated publish).
#   - non-release build (nightly, branch push) -> Sonatype snapshot repository
#     (direct HTTP PUT, immediately available, no staging or portal step).
#
# Vendored from rapidsai/shared-workflows. TODO: drop this file and
# java/cuopt/ci/maven-publish/ once rapidsai/shared-workflows#652 ships in a
# branch cuOpt tracks, and call that workflow directly again.
name: Java Maven publish (vendored)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: |
          Name of the GitHub Actions artifact (uploaded by the caller job via
          actions/upload-artifact) to download and publish. Contents must be
          a Maven repository directory.
        required: true
        type: string
      stage-for-maven-central-publish:
        description: |
          When true, leave the bundle PENDING in the Sonatype Central
          Publisher Portal for a human to release via the Portal UI
          (https://central.sonatype.com). When false (default), validate then
          drop the bundle. Only applies to the Maven Central path (release
          builds). Ignored on the snapshot path.
        required: false
        type: boolean
        default: false
      source-git-sha:
        description: |
          Git SHA to include in the retained bundle name for provenance.
        required: false
        type: string
        default: ''
      profile-id:
        description: |
          Sonatype staging profile to search, if different from the Maven groupId read from
          the POM (e.g. a verified parent namespace like com.nvidia for a com.nvidia.cuopt
          groupId). Defaults to the groupId when not set. Only applies to the Maven Central
          path (release builds); ignored on the snapshot path.
        required: false
        type: string
        default: ''
    secrets:
      GPG_PRIVATE_KEY:
        description: Armored GPG private key used to sign every artifact at upload.
        required: true
      GPG_PASSPHRASE:
        description: Passphrase for GPG_PRIVATE_KEY.
        required: true
      MAVEN_DEPLOY_TOKEN:
        description: Auth token paired with vars.MAVEN_DEPLOY_USERNAME.
        required: true

defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read

jobs:
  maven-publish:
    name: maven publish
    runs-on: linux-amd64-cpu4
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install gha-tools
        run: |
          # rapids-is-release-build lives in rapidsai/gha-tools. Fetch the
          # release tarball and add it to PATH so the release check below
          # (and any downstream steps) can find it.
          mkdir -p /tmp/gha-tools
          wget -qO- https://github.com/rapidsai/gha-tools/releases/latest/download/tools.tar.gz \
            | tar -xz -C /tmp/gha-tools
          echo "/tmp/gha-tools" >> "${GITHUB_PATH}"

      - name: Determine publish destination
        id: destination
        run: |
          export GITHUB_REF="refs/tags/v0.0.1" # TEMPORARY (#1970): fake a release tag to test
          if rapids-is-release-build; then
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download Maven repository artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name }}
          path: maven-repo

      - name: Prepare signed Maven bundle
        id: prepare
        run: |
          java/cuopt/ci/maven-publish/prepare_maven_bundle.sh \
            --input maven-repo \
            --output signed-maven-repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload to Maven Central
        id: publish-central
        if: ${{ steps.destination.outputs.is_release == 'true' }}
        run: |
          args=(
            --input signed-maven-repo
            --group-id "${GROUP_ID}"
            --artifact-id "${ARTIFACT_ID}"
            --version "${VERSION}"
            --output-bundle central-bundle.zip
            --auto-drop "${AUTO_DROP}"
          )
          if [[ -n ${PROFILE_ID} ]]; then
            args+=(--profile-id "${PROFILE_ID}")
          fi
          java/cuopt/ci/maven-publish/maven_central_publish.sh "${args[@]}"
        env:
          GROUP_ID: ${{ steps.prepare.outputs.GROUP_ID }}
          PROFILE_ID: ${{ inputs.profile-id }}
          ARTIFACT_ID: ${{ steps.prepare.outputs.ARTIFACT_ID }}
          VERSION: ${{ steps.prepare.outputs.VERSION }}
          # Invert: stage-for-...=true means don't auto-drop.
          AUTO_DROP: ${{ !inputs.stage-for-maven-central-publish }}
          MAVEN_DEPLOY_USERNAME: ${{ vars.MAVEN_DEPLOY_USERNAME }}
          MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}

      - name: Upload to Sonatype snapshots
        id: publish-snapshot
        if: ${{ steps.destination.outputs.is_release == 'false' }}
        run: |
          java/cuopt/ci/maven-publish/maven_snapshot_publish.sh \
            --input signed-maven-repo \
            --group-id "${GROUP_ID}" \
            --artifact-id "${ARTIFACT_ID}" \
            --version "${VERSION}" \
            --output-bundle snapshot-bundle.zip
        env:
          GROUP_ID: ${{ steps.prepare.outputs.GROUP_ID }}
          ARTIFACT_ID: ${{ steps.prepare.outputs.ARTIFACT_ID }}
          VERSION: ${{ steps.prepare.outputs.VERSION }}
          MAVEN_DEPLOY_USERNAME: ${{ vars.MAVEN_DEPLOY_USERNAME }}
          MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}

      - name: Retain signed Maven Central bundle
        if: ${{ !cancelled() && steps.destination.outputs.is_release == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-central-bundle-${{ steps.prepare.outputs.ARTIFACT_ID }}-${{ steps.prepare.outputs.VERSION }}-${{ inputs.source-git-sha }}
          path: central-bundle.zip
          if-no-files-found: ignore
          retention-days: 90

      - name: Retain signed Sonatype snapshot bundle
        if: ${{ !cancelled() && steps.destination.outputs.is_release == 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonatype-snapshot-bundle-${{ steps.prepare.outputs.ARTIFACT_ID }}-${{ steps.prepare.outputs.VERSION }}-${{ inputs.source-git-sha }}
          path: snapshot-bundle.zip
          if-no-files-found: ignore
          retention-days: 90
