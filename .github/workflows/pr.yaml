name: pr

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-builder:
    needs:
      - wheel-build-libcuopt
      - wheel-build-cuopt
      - wheel-tests-cuopt
      - wheel-build-cuopt-server
      - wheel-tests-cuopt-server
      - wheel-build-cuopt-mps-parser
      - wheel-build-cuopt-sh-client
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@branch-25.10
  wheel-build-cuopt-mps-parser:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/build_wheel_cuopt_mps_parser.sh
      package-name: cuopt_mps_parser
      package-type: python
      append-cuda-suffix: false
      matrix_filter: 'map(select(.ARCH == "amd64" and .PY_VER == "3.10" and (.CUDA_VER | startswith("12.9"))))'
  wheel-build-libcuopt:
    needs: wheel-build-cuopt-mps-parser
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      matrix_filter: 'map(select(.ARCH == "amd64" and .PY_VER == "3.10" and (.CUDA_VER | startswith("12.9"))))'
      package-type: cpp
      package-name: libcuopt
      build_type: pull-request
      script: ci/build_wheel_libcuopt.sh
  wheel-build-cuopt:
    needs: [wheel-build-cuopt-mps-parser, wheel-build-libcuopt]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/build_wheel_cuopt.sh
      package-name: cuopt
      package-type: python
      matrix_filter: 'map(select(.ARCH == "amd64" and .PY_VER == "3.10" and (.CUDA_VER | startswith("12.9"))))'
  wheel-tests-cuopt:
    needs: [wheel-build-cuopt, wheel-build-cuopt-mps-parser, wheel-build-cuopt-sh-client]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/test_wheel_cuopt.sh
      matrix_filter: 'map(select(.ARCH == "amd64" and .PY_VER == "3.10" and (.CUDA_VER | startswith("12.9"))))'
  wheel-build-cuopt-server:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/build_wheel_cuopt_server.sh
      package-name: cuopt_server
      package-type: python
      pure-wheel: true
      matrix_filter: 'map(select(.ARCH == "amd64" and .PY_VER == "3.10" and (.CUDA_VER | startswith("12.9"))))'
  wheel-build-cuopt-sh-client:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/build_wheel_cuopt_sh_client.sh
      package-name: cuopt_sh_client
      package-type: python
      append-cuda-suffix: false
      pure-wheel: true
      matrix_filter: 'map(select(.ARCH == "amd64" and .PY_VER == "3.10" and (.CUDA_VER | startswith("12.9"))))'
  wheel-tests-cuopt-server:
    needs: [wheel-build-cuopt, wheel-build-cuopt-server]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/test_wheel_cuopt_server.sh
      matrix_filter: 'map(select(.ARCH == "amd64" and .PY_VER == "3.10" and (.CUDA_VER | startswith("12.9"))))'
