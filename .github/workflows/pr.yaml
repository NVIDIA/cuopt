name: pr

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-builder:
    needs:
      - changed-files
      - checks
      - wheel-tests-jump
      - wheel-build-libcuopt
      - wheel-build-cuopt
      - wheel-tests-cuopt
      - wheel-build-cuopt-mps-parser
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@branch-25.10
  changed-files:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/changed-files.yaml@branch-25.10
    with:
      files_yaml: |
        test_cpp:
          - '**'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!ci/release/update-version-cuopt.sh'
          - '!ci/release/update-version-rapids.sh'
          - '!docs/**'
          - '!img/**'
          - '!notebooks/**'
          - '!python/**'
          - '!readme_pages/**'
          - '!container-builder/**'
          - '!helm-chart/**'
          - '!ngc/**'
          - '!omniverse/**'
          - '!regression/**'
          - '!resources/**'
          - '!ucf/**'
          - '!utilities/**'
        test_notebooks:
          - '**'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!ci/release/update-version-cuopt.sh'
          - '!ci/release/update-version-rapids.sh'
          - '!docs/**'
          - '!python/nvcf_client/**'
        test_python:
          - '**'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!ci/release/update-version-cuopt.sh'
          - '!ci/release/update-version-rapids.sh'
          - '!docs/**'
          - '!img/**'
          - '!notebooks/**'
          - '!python/nvcf_client/**'
        test_python_cuopt:
          - '**'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!ci/release/update-version-cuopt.sh'
          - '!ci/release/update-version-rapids.sh'
          - '!docs/**'
          - '!img/**'
          - '!notebooks/**'
          - '!python/cuopt_self_hosted/**'
          - '!python/cuopt_server/**'
          - '!python/nvcf_client/**'
        test_python_cuopt_server:
          - '**'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!ci/release/update-version-cuopt.sh'
          - '!ci/release/update-version-rapids.sh'
          - '!docs/**'
          - '!img/**'
          - '!notebooks/**'
          - '!python/cuopt_self_hosted/**'
          - '!python/nvcf_client/**'
  checks:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@branch-25.10
    with:
      enable_check_generated_files: false

  wheel-tests-jump:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/test_wheel_jump.sh

  wheel-build-cuopt-mps-parser:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/build_wheel_cuopt_mps_parser.sh
      package-name: cuopt_mps_parser
      package-type: python
      append-cuda-suffix: false
      # need 1 build per Python version and arch (but CUDA version doesn't matter so choose the latest)
      matrix_filter: 'group_by([.ARCH, (.PY_VER |split(".") | map(tonumber))])|map(max_by([(.CUDA_VER|split(".")|map(tonumber))]))'
  wheel-build-libcuopt:
    needs: wheel-build-cuopt-mps-parser
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      # build for every combination of arch and CUDA version, but only for the latest Python
      matrix_filter: group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))
      package-type: cpp
      package-name: libcuopt
      build_type: pull-request
      script: ci/build_wheel_libcuopt.sh
  wheel-build-cuopt:
    needs: [wheel-build-cuopt-mps-parser, wheel-build-libcuopt]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@branch-25.10
    with:
      build_type: pull-request
      script: ci/build_wheel_cuopt.sh
      package-name: cuopt
      package-type: python
  wheel-tests-cuopt:
    needs: [wheel-build-cuopt, wheel-build-cuopt-mps-parser, changed-files]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@branch-25.10
    #if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_cuopt
    with:
      build_type: pull-request
      script: ci/test_wheel_cuopt.sh