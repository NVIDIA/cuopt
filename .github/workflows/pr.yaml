name: pr

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    uses: ./.github/workflows/build_test_publish_images.yaml
    secrets: inherit
    with:
      branch: "branch-25.08"
      sha: "ea05ba1"
      date: "2025-07-23"
      build_type: "nightly"