          - '!CONTRIBUTING.md'
          - '!LICENSE'
          - '!README.md'
          - '!agents/**'
          - '!ci/build_docs.sh'
          - '!ci/build_python.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/docker/**'
          - '!ci/release/**'
          - '!ci/test_python.sh'
          - '!ci/test_self_hosted_service.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/thirdparty-testing/**'
          - '!ci/utils/sync_skills_version.sh'
          - '!ci/utils/validate_skills.sh'
          - '!container-builder/**'
