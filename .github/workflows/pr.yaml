name: pr

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    uses: ./.github/workflows/build_test_publish_images.yml
    runs-on: ubuntu-latest
    with:
      branch: "branch-25.08"
      sha: "e0dc603"
      date: "2025-07-02"
      build_type: "nightly"
    