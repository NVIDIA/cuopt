          - '!ucf/**'
          - '!utilities/**'
        test_java:
          # Path-positive list — easier to reason about than the inverse
          # pattern used for test_cpp / test_python.
          - 'java/**'
          - 'ci/build_java.sh'
          - 'ci/test_java.sh'
          - 'dependencies.yaml'
          - 'conda/environments/**'
          # Java bindings are jextract-generated from these C headers,
          # so any C API change should re-trigger Java tests.
          - 'cpp/include/cuopt/linear_programming/cuopt_c.h'
          - 'cpp/include/cuopt/linear_programming/constants.h'
          # Workflow files themselves
          - '.github/workflows/pr.yaml'
          - '.github/workflows/build.yaml'
  checks:
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@main
    with:
      enable_check_generated_files: false
  conda-cpp-build:
    needs: [checks, compute-matrix-filters, changed-files]
    # Consumed by conda-cpp-tests, conda-python-build, and (transitively) docs-build.
    if: >-
      fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp ||
      fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_conda ||
      fromJSON(needs.changed-files.outputs.changed_file_groups).build_docs
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      script: ci/build_cpp.sh
      matrix_filter: ${{ needs.compute-matrix-filters.outputs.conda_lean_filter }}
  conda-cpp-tests:
    needs: [conda-cpp-build, changed-files, compute-matrix-filters]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    with:
      build_type: pull-request
      script: ci/test_cpp.sh
      matrix_filter: ${{ needs.compute-matrix-filters.outputs.conda_test_filter }}
    secrets:
      script-env-secret-1-key: CUOPT_S3_URI
      script-env-secret-1-value: ${{ secrets.CUOPT_S3_URI }}
      script-env-secret-2-key: CUOPT_AWS_ACCESS_KEY_ID
      script-env-secret-2-value: ${{ secrets.CUOPT_AWS_ACCESS_KEY_ID }}
      script-env-secret-3-key: CUOPT_AWS_SECRET_ACCESS_KEY
      script-env-secret-3-value: ${{ secrets.CUOPT_AWS_SECRET_ACCESS_KEY }}
  conda-java-build-and-tests-matrix:
    # Derives the matrix from conda-cpp-build, filtered to amd64 because
    # integration tests need a GPU runner and only the amd64 GPU runner
    # (gpu-l4-latest-1) is currently wired up. arm64 builds + unit tests
    # are handled by the conda-java-build-arm64 job below.
    needs: [conda-cpp-build, changed-files]
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_java
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: pull-request
      matrix_name: conda-cpp-build
      matrix_filter: 'map(select(.ARCH == "amd64"))'
  conda-java-build-and-tests:
    # Combined build+test in one job (matches cuvs pattern). Splitting
    # this is a follow-up: requires shared-workflow surface for cross-job
    # artifact passing. cuvs Issue #868 tracks the same split.
    needs: conda-java-build-and-tests-matrix
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_java
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    with:
      build_type: pull-request
      node_type: "gpu-l4-latest-1"
      arch: "amd64"
      script: "ci/test_java.sh"
      file_to_upload: "java/cuopt-java/target/"
      artifact-name: "cuopt-java-cuda${{ needs.conda-java-build-and-tests-matrix.outputs.CUDA_VER }}"
  conda-java-build-arm64-matrix:
    # Matrix for the arm64 Java build, filtered to arm64 rows of
    # conda-cpp-build. Sibling of conda-java-build-and-tests-matrix
    # which handles amd64.
    needs: [conda-cpp-build, changed-files]
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_java
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: pull-request
      matrix_name: conda-cpp-build
      matrix_filter: 'map(select(.ARCH == "arm64"))'
  conda-java-build-arm64:
    # Build the JAR + run unit tests on arm64. Integration tests need a
    # GPU and the arm64 GPU runner isn't wired in yet, so IT continues
    # to run on amd64 only (conda-java-build-and-tests above).
    needs: conda-java-build-arm64-matrix
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_java
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    with:
      build_type: pull-request
      node_type: "linux-arm64-cpu16"
      arch: "arm64"
      script: "ci/build_java.sh --unit-tests-only"
      file_to_upload: "java/cuopt-java/target/"
      artifact-name: "cuopt-java-arm64-cuda${{ needs.conda-java-build-arm64-matrix.outputs.CUDA_VER }}"
  conda-python-build:
    needs: [conda-cpp-build, compute-matrix-filters, changed-files]
    # Consumed by conda-python-tests and docs-build.
    if: >-
      fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_conda ||
      fromJSON(needs.changed-files.outputs.changed_file_groups).build_docs
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@main
    with:
      build_type: pull-request
      script: ci/build_python.sh
      matrix_filter: ${{ needs.compute-matrix-filters.outputs.conda_test_filter }}
  conda-python-tests:
    needs: [conda-python-build, changed-files, compute-matrix-filters]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_conda
    with:
      run_codecov: false
      build_type: pull-request
      script: ci/test_python.sh
      matrix_filter: ${{ needs.compute-matrix-filters.outputs.conda_test_filter }}
    secrets:
      script-env-secret-1-key: CUOPT_S3_URI
      script-env-secret-1-value: ${{ secrets.CUOPT_S3_URI }}
      script-env-secret-2-key: CUOPT_AWS_ACCESS_KEY_ID
      script-env-secret-2-value: ${{ secrets.CUOPT_AWS_ACCESS_KEY_ID }}
      script-env-secret-3-key: CUOPT_AWS_SECRET_ACCESS_KEY
      script-env-secret-3-value: ${{ secrets.CUOPT_AWS_SECRET_ACCESS_KEY }}
  docs-build:
    needs: [conda-python-build, changed-files]
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).build_docs
    with:
      build_type: pull-request
      node_type: "gpu-l4-latest-1"
      arch: "amd64"
      file_to_upload: "docs/cuopt/build/html/"
      artifact-name: "cuopt_docs"
      container_image: "rapidsai/ci-conda:26.06-latest"
      script: "ci/build_docs.sh"
  wheel-build-cuopt-mps-parser:
    needs: [compute-matrix-filters, changed-files]
    # All wheel-build-* jobs feed the wheel test jobs, so they gate on the same group.
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_wheels
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      script: ci/build_wheel_cuopt_mps_parser.sh
      package-name: cuopt_mps_parser
      package-type: python
      append-cuda-suffix: false
      # need 1 build per Python version and arch (but CUDA version doesn't matter so choose the latest)
      matrix_filter: ${{ needs.compute-matrix-filters.outputs.mps_parser_filter }}
  wheel-build-libcuopt:
    needs: [wheel-build-cuopt-mps-parser, compute-matrix-filters, changed-files]
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_wheels
    secrets: inherit
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      # build for every combination of arch and CUDA version, but only for the latest Python
      matrix_filter: ${{ needs.compute-matrix-filters.outputs.libcuopt_filter }}
      package-type: cpp
      package-name: libcuopt
      build_type: pull-request
      script: ci/build_wheel_libcuopt.sh
