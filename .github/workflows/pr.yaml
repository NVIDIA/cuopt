name: pr

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  conda-cpp-tests:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    with:
      build_type: pull-request
      script: ci/wsl_diag/cpp.sh
      matrix_type: pull-request,wsl-pr
      matrix_filter: 'map(select(.OS == "wsl"))'
