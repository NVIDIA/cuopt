name: Julia Tests

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      branch:
        required: true
        type: string
      date:
        required: true
        type: string
      sha:
        required: true
        type: string
      libcuopt_wheelhouse:
        required: true
        type: string
        description: "Path to libcuopt wheelhouse for testing"

jobs:
  julia-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1.10'  # Use a stable LTS version
          arch: x64

      - name: Cache Julia packages
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ hashFiles('**/Project.toml') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file unzip

      - name: Download test datasets
        run: |
          ./datasets/linear_programming/download_pdlp_test_dataset.sh
          ./datasets/mip/download_miplib_test_dataset.sh
          cd ./datasets
          ./get_test_data.sh --solomon
          ./get_test_data.sh --tsp
          cd -

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pexpect

      - name: Install cuOpt wheels
        run: |
          # Install libcuopt wheel
          pip install "${{ inputs.libcuopt_wheelhouse }}"/libcuopt*.whl

      - name: Find and set up libcuopt library path
        run: |
          # Find libcuopt.so and add its directory to LD_LIBRARY_PATH
          LIBCUOPT_PATH=$(find /usr/local -name "libcuopt.so" -type f 2>/dev/null | head -1)
          if [ -n "$LIBCUOPT_PATH" ]; then
            echo "LIBCUOPT_PATH: $LIBCUOPT_PATH"
            LIBCUOPT_DIR=$(dirname "$LIBCUOPT_PATH")
            echo "LIBCUOPT_DIR: $LIBCUOPT_DIR"
            echo "LD_LIBRARY_PATH=${LIBCUOPT_DIR}:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
            echo "Found libcuopt.so at $LIBCUOPT_PATH, added directory to LD_LIBRARY_PATH: $LIBCUOPT_DIR"
          else
            echo "Warning: libcuopt.so not found in expected locations"
          fi

      - name: Clone cuOpt.jl repository
        run: |
          CUOPT_JL_DIR="$(mktemp -d)/cuOpt.jl"
          echo "Cloning cuOpt.jl into ${CUOPT_JL_DIR}"
          git clone https://github.com/jump-dev/cuOpt.jl.git "${CUOPT_JL_DIR}"
          echo "CUOPT_JL_DIR=${CUOPT_JL_DIR}" >> $GITHUB_ENV

      - name: Run Julia tests
        run: |
          cd $CUOPT_JL_DIR
          echo "Running Julia tests for cuOpt.jl"
          
          # Use Julia to instantiate and run tests for the package
          julia --project=. -e '
          import Pkg;
          Pkg.instantiate();
          # forcefully add maybe-missing deps (bad)
          try
              Pkg.add("Test")
          catch
          end
          println("Running Pkg.test() for cuOpt.jl -- this will spew output and may fail loudly");
          Pkg.test(; coverage=true)
          '

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-test-results
          path: |
            ${{ env.CUOPT_JL_DIR }}/test/
            ${{ env.CUOPT_JL_DIR }}/coverage/
          retention-days: 7
