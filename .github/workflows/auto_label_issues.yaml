name: Auto-label New Issues

on:
  issues:
    types: [opened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add awaiting response label to new issues
        uses: actions/github-script@v6
        with:
          script: |
            // Only process issues (not PRs)
            if (context.payload.issue && !context.payload.issue.pull_request) {
              console.log(`Adding 'awaiting response' label to issue #${context.payload.issue.number}`);

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['awaiting response']
              });

              console.log(`Successfully added 'awaiting response' label to issue #${context.payload.issue.number}`);
            } else {
              console.log('Skipping - this is a pull request, not an issue');
            }
