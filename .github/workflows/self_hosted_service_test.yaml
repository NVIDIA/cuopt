name: Test self-hosted service on local-setup

on:
  workflow_call:
    inputs:
      repo:
        type: string
      branch:
        type: string
      date:
        type: string
      sha:
        type: string
      build_type:
        required: true
        type: string
      script:
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  discussions: none
  id-token: write
  issues: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none


jobs:
  cuopt-service-matrix:
    name: Compute matrix
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      matrix_name: wheels-test
      # AMD64, latest CUDA within latest Python
      matrix_filter: map(select(.ARCH == "amd64")) | group_by(.PY_VER) | map(max_by(.CUDA_VER | split(".") | map(tonumber))) | [max_by(.PY_VER | split(".") | map(tonumber))]
  cuopt-service:
    name: self hosted service test
    runs-on: "linux-${{ matrix.ARCH }}-gpu-${{ matrix.GPU }}-${{ matrix.DRIVER }}-1"
    needs: cuopt-service-matrix
    strategy:
      matrix: ${{ fromJSON(needs.cuopt-service-matrix.outputs.matrix) }}
    container:
      image: "rapidsai/citestwheel:cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      options: "--network-alias cuopt-service"
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }} # GPU jobs must set this container env variable
        RAPIDS_BUILD_TYPE: ${{ inputs.build_type }}
        CUOPT_CLIENT_ID: ${{ secrets.CUOPT_PRD_TEST_CLIENT_ID }}
        CUOPT_CLIENT_SECRET: ${{ secrets.CUOPT_PRD_TEST_SECRET }}
        CUOPT_FUNCTION_ID: ${{ secrets.CUOPT_PRD_TEST_FUNCTION_ID }}
        GH_TOKEN: ${{ github.token }}
      ports:
        - "8000:8000"
      volumes:
        - /tmp/asset_dir/:/tmp/asset_dir/
        - /tmp/response_dir/:/tmp/response_dir/
    steps:
      - uses: aws-actions/configure-aws-credentials@023daa7fe5f7f817faa31fc0fc4a8d0fb6224ed0 # v1-node16
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 14400 # 4h
      - name: Run nvidia-smi to make sure GPU is working
        run: nvidia-smi

      - name: Install private index credentials in cibuildwheel container
        run: printf 'machine pypi.k8s.rapids.ai\n\tlogin cibuildwheel\n\tpassword ${{ secrets.RAPIDSAI_PYPI_CI_PASSWORD }}\n' > ~/.netrc

      - name: checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          fetch-depth: 0 # unshallow fetch for setuptools-scm
          persist-credentials: false

      - name: Standardize repository information
        uses: rapidsai/shared-actions/rapids-github-info@main
        with:
          repo: ${{ inputs.repo }}
          branch: ${{ inputs.branch }}
          date: ${{ inputs.date }}
          sha: ${{ inputs.sha }}

      - name: Run tests
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          script_path="$(realpath "$SCRIPT")"
          ci_dir="$(realpath ci)"

          # Use `realpath` to expand out both the script path and the ci path and compare to make sure
          # that user isn't giving a relative path to a file outside of `ci/`
          if [[ "$script_path" != "$ci_dir"/*.sh ]]; then
            echo "::error::Invalid script path '$SCRIPT'. Expected an existing ci/*.sh script inside the checkout"
            exit 1
          fi

          bash "$script_path"
