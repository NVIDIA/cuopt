name: Test images

on:
  workflow_call:
    inputs:
      ARCH:
        required: true
        type: string
      CUDA_VER:
        required: true
        type: string
      PYTHON_VER:
        required: true
        type: string
      IMAGE_TAG_PREFIX:
        required: true
        type: string


jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      CUDA_SHORT: ${{ steps.trim.outputs.CUDA_SHORT }}
      PYTHON_SHORT: ${{ steps.trim.outputs.PYTHON_SHORT }}
    steps:
      - name: Trim versions
        id: trim
        run: |
          CUDA_SHORT=$(echo "${{ inputs.CUDA_VER }}" | sed -E 's/([0-9]+\.[0-9]+)\.[0-9]+/\1/')
          PYTHON_SHORT=$(echo "${{ inputs.PYTHON_VER }}" | sed -E 's/([0-9]+\.[0-9]+)\.[0-9]+/\1/')

          echo "CUDA_SHORT=$CUDA_SHORT" >> $GITHUB_OUTPUT
          echo "PYTHON_SHORT=$PYTHON_SHORT" >> $GITHUB_OUTPUT

  test:
    runs-on: "linux-${{ inputs.ARCH }}-gpu-a100-latest-1"
    needs: prepare
    container:
      image: "nvidia/cuopt:${{ inputs.IMAGE_TAG_PREFIX }}-cuda${{ needs.prepare.outputs.CUDA_SHORT }}-py${{ needs.prepare.outputs.PYTHON_SHORT }}"
      options: --user root
    steps:
      - name: Checkout code repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          apt-get install -y file
      - name: Install pytest
        run: |
          su cuopt
          pip install --user pytest psutil
      - name: Test CLI
        run: |
          su cuopt
          export RAPIDS_DATASET_ROOT_DIR="$(realpath datasets)"
          bash python/libcuopt/libcuopt/tests/test_cli.sh
      - name: Test cuopt
        run: |
          su cuopt
          export RAPIDS_DATASET_ROOT_DIR="$(realpath datasets)"
          # Test Vehicle Routing
          python -m pytest python/cuopt/cuopt/tests/routing/test_vehicle_routing.py

          # Test Linear Programming
          python -m pytest python/cuopt/cuopt/tests/linear_programming/test_lp_solver.py::test_solver
      - name: Test cuopt server
        run: |
          su cuopt
          export RAPIDS_DATASET_ROOT_DIR="$(realpath datasets)"
          # Show your Python binary path
          which python

          python -m site
          python -c "import psutil; print(psutil.__version__)"

          python -m cuopt_server.cuopt_service &
          sleep 10
          pkill -f cuopt_server.cuopt_service
          python -m pytest python/cuopt_server/cuopt_server/tests/test_server.py
      - name: Download test data
        run: |
          su cuopt
          bash datasets/linear_programming/download_pdlp_test_dataset.sh
          bash datasets/mip/download_miplib_test_dataset.sh
          cd datasets
          ./get_test_data.sh --solomon
          ./get_test_data.sh --tsp
          cd -
      - name: Pytest cuOpt 
        run: |
          su cuopt
          export RAPIDS_DATASET_ROOT_DIR="$(realpath datasets)"
          python -m pytest python/cuopt/cuopt/tests/
      - name: Pytest cuOpt Server
        run: |
          su cuopt
          export RAPIDS_DATASET_ROOT_DIR="$(realpath datasets)"
          python -m pytest python/cuopt_server/cuopt_server/tests/