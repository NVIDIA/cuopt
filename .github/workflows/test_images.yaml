name: Test images

on:
  workflow_call:
    inputs:
      ARCH:
        required: true
        type: string
      CUDA_VER:
        required: true
        type: string
      PYTHON_VER:
        required: true
        type: string
      IMAGE_TAG_PREFIX:
        required: true
        type: string
      sha:
        description: "sha: full git commit SHA to check out"
        required: true
        type: string

jobs:

  prepare:
    name: test-images (prepare)
    runs-on: ubuntu-latest
    outputs:
      CUDA_MAJOR: ${{ steps.trim.outputs.CUDA_MAJOR }}
    steps:
      - name: Get CUDA major version
        id: trim
        env:
          CUDA_VER: ${{ inputs.CUDA_VER }}
        run: |
          echo "CUDA_MAJOR=${CUDA_VER%%.*}" >> $GITHUB_OUTPUT

  test:
    name: test-images (${{ inputs.ARCH }}, ${{ inputs.IMAGE_TAG_PREFIX }}-cu${{ needs.prepare.outputs.CUDA_MAJOR }})
    runs-on: "linux-${{ inputs.ARCH }}-gpu-a100-latest-1"
    needs: prepare
    container:
      image: "nvidia/cuopt:${{ inputs.IMAGE_TAG_PREFIX }}-cu${{ needs.prepare.outputs.CUDA_MAJOR }}"
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Test cuopt
        run: |
          bash ./ci/docker/test_image.sh

  test-ubi10:
    name: test-images-ubi10 (${{ inputs.ARCH }}, ${{ inputs.IMAGE_TAG_PREFIX }}-cu${{ needs.prepare.outputs.CUDA_MAJOR }}-ubi10)
    if: ${{ startsWith(inputs.CUDA_VER, '13.') }}
    runs-on: "linux-${{ inputs.ARCH }}-gpu-a100-latest-1"
    needs: prepare
    container:
      image: "nvidia/cuopt:${{ inputs.IMAGE_TAG_PREFIX }}-cu${{ needs.prepare.outputs.CUDA_MAJOR }}-ubi10"
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Test cuopt
        run: |
          bash ./ci/docker/test_image.sh

  # Host-side startup smoke: exercises ENTRYPOINT/CMD (proxy), grpc, and
  # legacy. The jobs above
  # run *inside* the image as a GHA
  # container and never launch the servers, so they cannot catch packaging
  # gaps such as UBI10's RHEL lib/lib64 NCCL path miss.
  smoke:
    name: smoke-images (${{ inputs.ARCH }}, cu${{ needs.prepare.outputs.CUDA_MAJOR }})
    runs-on: "linux-${{ inputs.ARCH }}-gpu-a100-latest-1"
    needs: prepare
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Smoke Ubuntu image (proxy + gRPC)
        env:
          IMAGE_TAG_PREFIX: ${{ inputs.IMAGE_TAG_PREFIX }}
          CUDA_MAJOR: ${{ needs.prepare.outputs.CUDA_MAJOR }}
        run: |
          bash ./ci/docker/smoke_image.sh "nvidia/cuopt:${IMAGE_TAG_PREFIX}-cu${CUDA_MAJOR}"
      - name: Smoke UBI10 image (proxy + gRPC)
        if: ${{ startsWith(inputs.CUDA_VER, '13.') }}
        env:
          IMAGE_TAG_PREFIX: ${{ inputs.IMAGE_TAG_PREFIX }}
          CUDA_MAJOR: ${{ needs.prepare.outputs.CUDA_MAJOR }}
        run: |
          bash ./ci/docker/smoke_image.sh "nvidia/cuopt:${IMAGE_TAG_PREFIX}-cu${CUDA_MAJOR}-ubi10"
