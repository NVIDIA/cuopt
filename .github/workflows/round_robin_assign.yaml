name: Round-Robin Issue Assigner

on:
  issues:
    types: [opened]

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue round-robin only if unassigned
        uses: actions/github-script@v6
        with:
          script: |
            const assignees = [
              'kaatish',
              'rg20',
              'akifcorduk',
              'hlinsen',
              'Kh4ster',
              'aliceb-nv',
              'chris-maes',
              'rgsl888prabhu',
              'Iroy30',
              'tmckayus'
            ];

            const issue = context.payload.issue;

            // Only assign if no one is assigned yet
            if (!issue.assignees || issue.assignees.length === 0) {
              const issueNumber = issue.number;
              const index = (issueNumber - 1) % assignees.length;
              const assignee = assignees[index];
              
              console.log(`Assigning issue #${issueNumber} to @${assignee}`);

              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: [assignee],
              });
            } else {
              console.log(`Issue #${issue.number} already has assignees, skipping.`);
            }
