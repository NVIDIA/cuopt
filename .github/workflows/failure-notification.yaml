name: failure-notification

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
        description: "Repository name"
      branch:
        required: true
        type: string
        description: "Branch name"
      commit_sha:
        required: true
        type: string
        description: "Commit SHA"
      build_type:
        required: true
        type: string
        description: "Build type"
      workflow_run_id:
        required: true
        type: string
        description: "Workflow run ID"
      workflow_run_number:
        required: true
        type: string
        description: "Workflow run number"
      commit_timestamp:
        required: true
        type: string
        description: "Commit timestamp"
      commit_message:
        required: false
        type: string
        description: "Commit message"
        default: ""
      has_failures:
        required: true
        type: boolean
        description: "Whether there are failures"
      failed_jobs:
        required: true
        type: string
        description: "Comma-separated list of failed jobs"
      failed_jobs_formatted:
        required: true
        type: string
        description: "Formatted list of failed jobs"
      is_cancelled:
        required: true
        type: boolean
        description: "Whether the workflow was cancelled"
    secrets:
      CUOPT_SLACK_WEBHOOK_URL:
        required: true

jobs:
  send-notification:
    if: inputs.has_failures == true && inputs.is_cancelled == false
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Failure Notification
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          payload: |
            {
              "icon_emoji": ":x:",
              "username": "CuOpt Build Notifier - Build Failed",
              "text": "<!subteam^S086JPX5CSC|@cuopt-infra> 🚨 Build failed!",
              "attachments": [
                {
                  "author_name": "Build Failed - ${{ inputs.repository }}",
                  "author_link": "https://github.com/${{ inputs.repository }}",
                  "color": "danger",
                  "fallback": "Build failed for ${{ inputs.repository }} on ${{ inputs.branch }}",
                  "text": "<https://github.com/${{ inputs.repository }}/actions/runs/${{ inputs.workflow_run_id }}|${{ inputs.repository }} Build #${{ inputs.workflow_run_number }}>",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ inputs.repository }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ inputs.branch }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "<https://github.com/${{ inputs.repository }}/commit/${{ inputs.commit_sha }}|${{ inputs.commit_sha }}>",
                      "short": true
                    },
                    {
                      "title": "Build Type",
                      "value": "${{ inputs.build_type }}",
                      "short": true
                    },
                    {
                      "title": "Failed Jobs",
                      "value": "${{ inputs.failed_jobs_formatted }}",
                      "short": false
                    },
                    {
                      "title": "Failed At",
                      "value": "${{ inputs.commit_timestamp }}",
                      "short": true
                    }
                  ],
                  "footer": "<https://github.com/${{ inputs.repository }}|${{ inputs.repository }}>",
                  "footer_icon": "https://avatars0.githubusercontent.com/u/43887749?s=32&v=4"
                }
              ]
            }
          payload-templated: true
          webhook: ${{ secrets.CUOPT_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
