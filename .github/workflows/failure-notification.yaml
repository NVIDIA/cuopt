name: failure-notification

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
        description: "Repository name"
      branch:
        required: true
        type: string
        description: "Branch name"
      commit_sha:
        required: true
        type: string
        description: "Commit SHA"
      build_type:
        required: true
        type: string
        description: "Build type"
      workflow_run_id:
        required: true
        type: string
        description: "Workflow run ID"
      workflow_run_number:
        required: true
        type: string
        description: "Workflow run number"
      commit_timestamp:
        required: true
        type: string
        description: "Commit timestamp"
      commit_message:
        required: false
        type: string
        description: "Commit message"
        default: ""
    secrets:
      CUOPT_SLACK_WEBHOOK_URL:
        required: true

jobs:
  check-and-notify:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for Failures
        id: check-failures
        run: |
          # Extract job names from needs context automatically
          needs_json='${{ toJson(needs) }}'
          job_names=$(echo "$needs_json" | jq -r 'keys[]')
          
          failed_jobs=()
          has_failures=false
          
          echo "🔍 Checking job results..."
          echo "📋 All jobs: $(echo "$job_names" | tr '\n' ' ')"
          
          # Check each job for failures
          while IFS= read -r job; do
            result=$(echo "$needs_json" | jq -r --arg job "$job" '.[$job].result // "unknown"')
            echo "  • $job: $result"
            if [[ "$result" == "failure" ]]; then
              failed_jobs+=("$job")
              has_failures=true
              echo "    ❌ FAILED"
            elif [[ "$result" == "success" ]]; then
              echo "    ✅ SUCCESS"
            elif [[ "$result" == "cancelled" ]]; then
              echo "    ⏹️ CANCELLED"
            else
              echo "    ❓ UNKNOWN"
            fi
          done <<< "$job_names"
          
          # Log summary
          if [[ "$has_failures" == "true" ]]; then
            echo "🚨 FAILURE DETECTED!"
            echo "💥 Failed jobs: ${failed_jobs[*]}"
            echo "has-failures=true" >> $GITHUB_OUTPUT
            echo "failed-jobs=${failed_jobs[*]}" >> $GITHUB_OUTPUT
          else
            echo "✅ All jobs completed successfully"
            echo "has-failures=false" >> $GITHUB_OUTPUT
            echo "failed-jobs=" >> $GITHUB_OUTPUT
          fi
          
          # Check if workflow was manually cancelled
          if [[ "${{ inputs.commit_message }}" == *"[skip ci]"* ]] || 
             [[ "${{ inputs.commit_message }}" == *"[ci skip]"* ]]; then
            echo "⏭️ Workflow was manually cancelled (skip ci detected)"
            echo "is-cancelled=true" >> $GITHUB_OUTPUT
          else
            echo "is-cancelled=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Format Failed Jobs List
        id: format-failed-jobs
        if: steps.check-failures.outputs.has-failures == 'true'
        run: |
          # Format failed jobs list with bullet points
          if [[ -n "${{ steps.check-failures.outputs.failed-jobs }}" ]]; then
            failed_jobs_formatted=$(echo "${{ steps.check-failures.outputs.failed-jobs }}" | tr ' ' '\n' | sed 's/^/• /' | tr '\n' '\n')
            echo "failed-jobs-formatted<<EOF" >> $GITHUB_OUTPUT
            echo "$failed_jobs_formatted" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "failed-jobs-formatted=" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Failure Notification
        if: steps.check-failures.outputs.has-failures == 'true' && steps.check-failures.outputs.is-cancelled == 'false'
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          payload: |
            {
              "icon_emoji": ":x:",
              "username": "CuOpt Build Notifier - Build Failed",
              "text": "<!subteam^S01ABC123DEF|@cuopt-infra> 🚨 Build failed!",
              "attachments": [
                {
                  "author_name": "Build Failed - ${{ inputs.repository }}",
                  "author_link": "https://github.com/${{ inputs.repository }}",
                  "color": "danger",
                  "fallback": "Build failed for ${{ inputs.repository }} on ${{ inputs.branch }}",
                  "text": "<https://github.com/${{ inputs.repository }}/actions/runs/${{ inputs.workflow_run_id }}|${{ inputs.repository }} Build #${{ inputs.workflow_run_number }}>",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ inputs.repository }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ inputs.branch }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "<https://github.com/${{ inputs.repository }}/commit/${{ inputs.commit_sha }}|${{ inputs.commit_sha }}>",
                      "short": true
                    },
                    {
                      "title": "Build Type",
                      "value": "${{ inputs.build_type }}",
                      "short": true
                    },
                    {
                      "title": "Failed Jobs",
                      "value": "${{ steps.format-failed-jobs.outputs.failed-jobs-formatted }}",
                      "short": false
                    },
                    {
                      "title": "Failed At",
                      "value": "${{ inputs.commit_timestamp }}",
                      "short": true
                    }
                  ],
                  "footer": "<https://github.com/${{ inputs.repository }}|${{ inputs.repository }}>",
                  "footer_icon": "https://avatars0.githubusercontent.com/u/43887749?s=32&v=4"
                }
              ]
            }
          payload-templated: true
          webhook: ${{ secrets.CUOPT_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
