name: Trigger Nightly cuOpt Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # 5am UTC / 1am EST

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      DATE: ${{ steps.compute-matrix.outputs.DATE }}
      MATRIX: ${{ steps.compute-matrix.outputs.MATRIX }}
    steps:
      - name: compute matrix
        id: compute-matrix
        shell: bash
        run: |
          # add more list items here to run nightlies for more branches
          export CI_MATRIX="
          - branch: '25.10'
            sha: "\'$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/branch-25.10 | awk '{print $1}')\'"
          "
          MATRIX="$(
            yq -n --indent 0 -o json 'env(CI_MATRIX)' \
            | jq -c '{include: .}'
          )"

          echo "MATRIX=${MATRIX}" | tee --append "${GITHUB_OUTPUT}"
          echo "DATE=$(date +%F)" | tee --append "${GITHUB_OUTPUT}"
  build:
    needs: [compute-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.MATRIX) }}
    name: build (${{ matrix.branch }})
    uses: ./.github/workflows/build.yaml
    with:
      # Because build and test happen in the same workflow run, build_type="branch" is preferred here.
      # That tells artifact-downloading code to just look for artifacts from this same run.
      build_type: branch
      branch: ${{ matrix.branch }}
      date: ${{ needs.compute-matrix.outputs.DATE }}
      sha: ${{ matrix.sha }}
  test:
    needs: [compute-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.MATRIX) }}
    name: test (${{ matrix.branch }})
    uses: ./.github/workflows/test.yaml
    with:
      # Because build and test happen in the same workflow run, build_type="branch" is preferred here.
      # That tells artifact-downloading code to just look for artifacts from this same run.
      build_type: branch
      branch: ${{ matrix.branch }}
      date: ${{ needs.compute-matrix.outputs.DATE }}
      sha: ${{ matrix.sha }}
