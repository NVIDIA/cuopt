sonar.projectKey=GPUSW_cuOpt_Nvidia-cuOpt_cuopt
sonar.projectName=NVIDIA cuOpt
sonar.projectVersion=1.0

# Source code location (relative to projectBaseDir which is .github)
sonar.sources=../

# Exclusions - files/directories to skip
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.min.js,\
  **/cpp/build/**,\
  **/cvxpy/**,\
  **/datasets/**,\
  **/img/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  **/thirdparty/**

# Test files
sonar.tests=../
sonar.test.inclusions=**/tests/**,**/test_*.py,**/test_*.cpp,**/test_*.cu

# Coverage exclusions
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/test_*.cpp,**/test_*.cu

# Language-specific settings
sonar.python.version=3.10,3.11,3.12,3.13
sonar.sourceEncoding=UTF-8
