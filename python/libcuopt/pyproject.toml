[build-system]
build-backend = "rapids_build_backend.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "scikit-build-core[pyproject]>=0.11.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project]
name = "libcuopt"
dynamic = ["version"]
description = "cuOpt - GPU Optimizer (C++)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "libcuopt-client==26.12.*,>=0.0.0a0",
    "libcuopt-mathopt==26.12.*,>=0.0.0a0",
    "libcuopt-routing==26.12.*,>=0.0.0a0",
    "libraft==26.10.*,>=0.0.0a0",
    "librmm==26.12.*,>=0.0.0a0",
    "rapids-logger==0.3.*",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://docs.nvidia.com/cuopt/introduction.html"
Source = "https://github.com/nvidia/cuopt"

[project.entry-points."cmake.prefix"]
libcuopt = "libcuopt"

[project.scripts]
cuopt_grpc_server = "libcuopt._grpc_server_wrapper:main"

[tool.pydistcheck]
select = [
    # note: max_allowed_size_compressed is set as a command-line arg
    "distro-too-large-compressed",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages = ["libcuopt"]
wheel.install-dir = "libcuopt"
wheel.py-api = "py3"
# Thin metapackage: engine libraries come from their own wheels now (#1635).
# "dev" = linker script, "cuopt" = rapids_export's config/export set, "grpc-server" =
# cuopt_grpc_server. "Unspecified" carries rapids-cmake's CCCL redirect files, needed
# for find_dependency(rmm) to resolve cleanly instead of hitting librmm's own
# (order-dependent) copy -- see #2013.
install.components = ["dev", "cuopt", "grpc-server", "Unspecified"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "libcuopt/VERSION"
regex = "(?P<value>.*)"

[tool.rapids-build-backend]
build-backend = "scikit_build_core.build"
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true;use_cuda_wheels=true"
requires = [
    "cmake>=4.0",
    "libcuopt-client==26.12.*,>=0.0.0a0",
    "libcuopt-mathopt==26.12.*,>=0.0.0a0",
    "libcuopt-routing==26.12.*,>=0.0.0a0",
    "libraft==26.10.*,>=0.0.0a0",
    "librmm==26.12.*,>=0.0.0a0",
    "ninja",
    "rapids-logger==0.3.*",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
