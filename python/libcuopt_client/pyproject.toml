[build-system]
build-backend = "rapids_build_backend.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "scikit-build-core[pyproject]>=0.11.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project]
name = "libcuopt-client"
dynamic = ["version"]
description = "cuOpt host-side client libraries (C++)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "rapids-logger==0.3.*",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://docs.nvidia.com/cuopt/introduction.html"
Source = "https://github.com/nvidia/cuopt"

[project.entry-points."cmake.prefix"]
libcuopt_client = "libcuopt_client"

[tool.pydistcheck]
select = [
    # note: max_allowed_size_compressed is set as a command-line arg
    "distro-too-large-compressed",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages = ["libcuopt_client"]
wheel.install-dir = "libcuopt_client"
wheel.py-api = "py3"
# The whole point of this package: stage only this component's install rules,
# so the wheel carries one library instead of all three.
install.components = ["client", "client-dev"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "libcuopt_client/VERSION"
regex = "(?P<value>.*)"

[tool.rapids-build-backend]
build-backend = "scikit_build_core.build"
dependencies-file = "../../dependencies.yaml"
# The client links no CUDA and no rmm, so the wheel name carries no CUDA suffix.
disable-cuda = true
matrix-entry = "cuda_suffixed=false;use_cuda_wheels=false"
requires = [
    "cmake>=4.0",
    "librmm==26.10.*,>=0.0.0a0",
    "ninja",
    "rapids-logger==0.3.*",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
