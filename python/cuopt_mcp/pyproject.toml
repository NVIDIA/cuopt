[build-system]
build-backend = "rapids_build_backend.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "setuptools>=77.0.0",
    "wheel",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project]
name = "cuopt_mcp"
dynamic = ["version"]
description = "MCP server exposing NVIDIA cuOpt LP/MILP solving to AI agents"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cuopt==26.10.*,>=0.0.0a0",
    "mcp>=2.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest-cov",
    "pytest-rerunfailures",
    "pytest-xdist",
    "pytest<9.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://docs.nvidia.com/cuopt/introduction.html"
Source = "https://github.com/nvidia/cuopt"

[project.scripts]
cuopt-mcp = "cuopt_mcp:main"

[tool.setuptools]
zip-safe = false

[tool.setuptools.dynamic]
version = {file = "cuopt_mcp/VERSION"}

[tool.setuptools.packages.find]
include = ["cuopt_mcp*"]

[tool.setuptools.package-data]
cuopt_mcp = ["VERSION", "_generated/*.json"]

[tool.rapids-build-backend]
build-backend = "setuptools.build_meta"
dependencies-file = "../../dependencies.yaml"
# The package is pure Python, but it depends on cuopt, whose distribution name
# carries a -cuXX suffix. disable-cuda would drop the suffix from this package's
# name and from that dependency alike, leaving a requirement on plain "cuopt"
# that no CUDA-suffixed build publishes. The suffix here is inherited from the
# dependency, not from anything this package compiles.
matrix-entry = "cuda_suffixed=true"
