#
# Section headings use title case. Product names, acronyms, and API
# identifiers keep their own casing and are listed under `exceptions`.
extends: capitalization
message: "Heading '%s' should use title case."
level: error
scope: heading
match: $title
style: Chicago
exceptions:
  # Product and library names
  - cuOpt
  - cuDF
  - cuDSS
  - cuML
  - cuSolver
  - cuSparse
  - cuopt_cli
  - cuopt_grpc_server
  - cuopt_sh
  - cuopt_sh_client
  - gRPC
  - mTLS
  - nvidia
  - pip
  - conda
  - kubeadm
  - Docker
  - Helm
  - Kubernetes
  - PyPI
  - NGC
  # Package / distribution names as they appear on PyPI, conda, and NGC.
  #
  # Keep this list narrow. Exceptions match whole words, case-sensitively, and
  # a single match makes Vale skip the ENTIRE heading. A broad entry therefore
  # disables the check for every heading that mentions it -- a bare "cuopt",
  # for example, also silences "Contact us - cuopt@nvidia.com". Re-run
  # `vale docs/cuopt/source` after editing this list.
  - libcuopt
  - (cuopt)
  - cuopt-server
  - cuopt-cli
  # API identifiers that must keep their source spelling
  - solver_configs
