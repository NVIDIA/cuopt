# Source of truth for the three C++ test filters in .github/workflows/pr.yaml.
# Edit this file, then run: pre-commit run generate-test-paths --all-files
# Each filter excludes common_exclusions; routing also excludes mathopt_only,
# and mathopt also excludes routing_only. Unlisted paths keep triggering tests.

common_exclusions:
  - '**/*.md'
  - '.ai/**'
  - '.clang-format'
  - '.claude-plugin/**'
  - '.coderabbit.yaml'
  - '.cursor-plugin/**'
  - '.gitattributes'
  - '.github/.ai/**'
  - '.github/.coderabbit_review_guide.md'
  - '.github/CODEOWNERS'
  - '.github/CODE_OF_CONDUCT.md'
  - '.github/ISSUE_TEMPLATE/**'
  - '.github/PULL_REQUEST_TEMPLATE.md'
  - '.github/SECURITY.md'
  - '.github/agents/**'
  - '.github/copy-pr-bot.yaml'
  - '.github/ops-bot.yaml'
  - '.github/release.yml'
  - '.github/workflows/build.yaml'
  - '.github/workflows/build_images.yaml'
  - '.github/workflows/build_test_publish_images.yaml'
  - '.github/workflows/cloud_ci.yaml'
  - '.github/workflows/kitmaker_portal.yaml'
  - '.github/workflows/nightly-summary.yaml'
  - '.github/workflows/nightly.yaml'
  - '.github/workflows/request-nvskills-ci.yml'
  - '.github/workflows/self_hosted_service_test.yaml'
  - '.github/workflows/test.yaml'
  - '.github/workflows/test_images.yaml'
  - '.github/workflows/trigger-breaking-change-alert.yaml'
  - '.gitignore'
  - '.pre-commit-config.yaml'
  - '.yamllint.yaml'
  - 'ci/utils/pr_test_summary.py'
  - 'codecov.yml'
  - 'AGENTS.md'
  - 'CONTRIBUTING.md'
  - 'LICENSE'
  - 'README.md'
  - 'SECURITY.md'
  - 'agents/**'
  - 'ci/build_docs.sh'
  - 'ci/build_java.sh'
  - 'ci/build_java_static.sh'
  - 'ci/build_python.sh'
  - 'ci/build_wheel*.sh'
  - 'ci/check_style.sh'
  - 'ci/docker/**'
  - 'ci/release/**'
  - 'ci/run-vale.sh'
  - 'ci/test_python.sh'
  - 'ci/test_java.sh'
  - 'ci/test_self_hosted_service.sh'
  - 'ci/test_wheel*.sh'
  - 'ci/thirdparty-testing/**'
  - 'ci/utils/sync_skills_version.sh'
  - 'ci/utils/validate_skills.sh'
  - 'container-builder/**'
  - 'docs/**'
  - 'gemini-extension.json'
  - 'helmchart/**'
  - 'img/**'
  - 'java/**'
  - 'ngc/**'
  - 'notebooks/**'
  - 'python/**'
  - 'skills/**/SKILL.md'
  - 'skills/**/skill-card.md'
  - 'skills/**/skill.oms.sig'
  - 'skills/**/evals/**'
  - 'skills/**/benchmark/**'
  - 'skills/**/references/**'
  - 'sonar-project.properties'
  - 'sonarqube/**'
  - 'ucf/**'
  - 'utilities/**'

mathopt_only:
  - 'cpp/include/cuopt/linear_programming/**'
  - 'cpp/include/cuopt/mathematical_optimization/**'
  - 'cpp/src/barrier/**'
  - 'cpp/src/branch_and_bound/**'
  - 'cpp/src/cuts/**'
  - 'cpp/src/dual_simplex/**'
  - 'cpp/src/io/*'
  - 'cpp/src/io/experimental_mps_fast/**'
  - 'cpp/src/linear_algebra/**'
  - 'cpp/src/math_optimization/**'
  - 'cpp/src/mip_heuristics/**'
  - 'cpp/src/pdlp/**'
  - 'cpp/src/presolve/**'
  - 'cpp/tests/dual_simplex/**'
  - 'cpp/tests/internal/**'
  - 'cpp/tests/linear_programming/c_api_tests/**'
  - 'cpp/tests/linear_programming/grpc/**'
  - 'cpp/tests/linear_programming/experimental_mps_fast/**'
  - 'cpp/tests/linear_programming/unit_tests/**'
  - 'cpp/tests/linear_programming/utilities/**'
  - 'cpp/tests/linear_programming/*.cpp'
  - 'cpp/tests/linear_programming/*.cu'
  - 'cpp/tests/mip/**'
  - 'cpp/tests/qp/**'
  - 'cpp/tests/socp/**'

routing_only:
  - 'cpp/include/cuopt/routing/assignment.hpp'
  - 'cpp/include/cuopt/routing/cython/**'
  - 'cpp/include/cuopt/routing/data_model_view.hpp'
  - 'cpp/include/cuopt/routing/distance_engine/**'
  - 'cpp/include/cuopt/routing/routing_structures.hpp'
  - 'cpp/include/cuopt/routing/solve.hpp'
  - 'cpp/src/distance/**'
  - 'cpp/src/routing/**'
  - 'cpp/tests/distance_engine/**'
  - 'cpp/tests/examples/routing/**'
  - 'cpp/tests/routing/**'
