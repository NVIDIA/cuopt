schema_version: 1

context:
  version: ${{ env.get("RAPIDS_PACKAGE_VERSION") }}
  minor_version: ${{ (version | split("."))[:2] | join(".") }}
  cuda_version: ${{ (env.get("RAPIDS_CUDA_VERSION") | split("."))[:2] | join(".") }}
  cuda_major: '${{ (env.get("RAPIDS_CUDA_VERSION") | split("."))[0] }}'
  date_string: '${{ env.get("RAPIDS_DATE_STRING") }}'
  head_rev: '${{ git.head_rev(".")[:8] }}'
  build_type: '${{ env.get("RAPIDS_BUILD_TYPE") }}'

recipe:
  name: libcuopt-split

cache:
  source:
    path: ../../..

  build:
    script:
      content: |
        # Remove `-fdebug-prefix-map` line from CFLAGS and CXXFLAGS so the
        # incrementing version number in the compile line doesn't break the
        # cache
        set -x
        export CFLAGS=$(echo $CFLAGS | sed -E 's@\-fdebug\-prefix\-map[^ ]*@@g')
        export CXXFLAGS=$(echo $CXXFLAGS | sed -E 's@\-fdebug\-prefix\-map[^ ]*@@g')
        set +x

        # Workaround for abseil-cpp#1624: Mutex::Dtor() not exported from shared libabseil on Linux.
        # Build gRPC/Protobuf/Abseil from source to ensure consistent ABI and avoid symbol issues.
        # This is the same approach used for wheel builds (ci/utils/install_protobuf_grpc.sh).
        GRPC_VERSION="v1.64.2"
        GRPC_INSTALL_DIR="${SRC_DIR}/grpc_install"
        CMAKE_STD_FLAGS="-DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON"
        
        echo "Building gRPC ${GRPC_VERSION} and dependencies from source..."
        rm -rf "${SRC_DIR}/grpc-src" "${GRPC_INSTALL_DIR}"
        mkdir -p "${GRPC_INSTALL_DIR}"
        
        # Clone gRPC with submodules
        git clone --depth 1 --branch "${GRPC_VERSION}" --recurse-submodules --shallow-submodules \
            https://github.com/grpc/grpc.git "${SRC_DIR}/grpc-src"
        
        # Build and install Abseil first (from gRPC's submodule)
        echo "Building Abseil..."
        cmake -S "${SRC_DIR}/grpc-src/third_party/abseil-cpp" -B "${SRC_DIR}/absl-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            ${CMAKE_STD_FLAGS} \
            -DABSL_PROPAGATE_CXX_STD=ON \
            -DCMAKE_INSTALL_PREFIX="${GRPC_INSTALL_DIR}"
        cmake --build "${SRC_DIR}/absl-build" --parallel
        cmake --install "${SRC_DIR}/absl-build"
        
        # Build and install Protobuf (using installed Abseil)
        echo "Building Protobuf..."
        cmake -S "${SRC_DIR}/grpc-src/third_party/protobuf" -B "${SRC_DIR}/protobuf-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            ${CMAKE_STD_FLAGS} \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_ABSL_PROVIDER=package \
            -DCMAKE_PREFIX_PATH="${GRPC_INSTALL_DIR}" \
            -DCMAKE_INSTALL_PREFIX="${GRPC_INSTALL_DIR}"
        cmake --build "${SRC_DIR}/protobuf-build" --parallel
        cmake --install "${SRC_DIR}/protobuf-build"
        
        # Build and install gRPC (using installed Abseil and Protobuf)
        echo "Building gRPC..."
        cmake -S "${SRC_DIR}/grpc-src" -B "${SRC_DIR}/grpc-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            ${CMAKE_STD_FLAGS} \
            -DgRPC_INSTALL=ON \
            -DgRPC_BUILD_TESTS=OFF \
            -DgRPC_BUILD_CODEGEN=ON \
            -DgRPC_BUILD_GRPC_NODE_PLUGIN=OFF \
            -DgRPC_ABSL_PROVIDER=package \
            -DgRPC_PROTOBUF_PROVIDER=package \
            -DgRPC_RE2_PROVIDER=module \
            -DgRPC_SSL_PROVIDER=package \
            -DgRPC_ZLIB_PROVIDER=package \
            -DgRPC_CARES_PROVIDER=package \
            -DCMAKE_PREFIX_PATH="${GRPC_INSTALL_DIR}" \
            -DCMAKE_INSTALL_PREFIX="${GRPC_INSTALL_DIR}"
        cmake --build "${SRC_DIR}/grpc-build" --parallel
        cmake --install "${SRC_DIR}/grpc-build"
        
        echo "gRPC installed to: ${GRPC_INSTALL_DIR}"
        
        # Build libcuopt with our gRPC
        export CMAKE_PREFIX_PATH="${GRPC_INSTALL_DIR}:${CMAKE_PREFIX_PATH:-}"
        ./build.sh -n -v ${BUILD_EXTRA_FLAGS} libmps_parser libcuopt deb --allgpuarch --cmake-args=\"-DCMAKE_INSTALL_LIBDIR=lib -DBUILD_REMOTE_SERVER=ON -DCMAKE_PREFIX_PATH=${GRPC_INSTALL_DIR}\"
      secrets:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - AWS_SESSION_TOKEN
      env:
        # Enable assertions (-a flag) for PR builds, but not for nightly or release builds
        BUILD_EXTRA_FLAGS: '${{ "-a" if build_type == "pull-request" else "" }}'
        CMAKE_C_COMPILER_LAUNCHER: ${{ env.get("CMAKE_C_COMPILER_LAUNCHER") }}
        CMAKE_CUDA_COMPILER_LAUNCHER: ${{ env.get("CMAKE_CUDA_COMPILER_LAUNCHER") }}
        CMAKE_CXX_COMPILER_LAUNCHER: ${{ env.get("CMAKE_CXX_COMPILER_LAUNCHER") }}
        CMAKE_GENERATOR: ${{ env.get("CMAKE_GENERATOR") }}
        PARALLEL_LEVEL: ${{ env.get("PARALLEL_LEVEL") }}
        SCCACHE_BUCKET: ${{ env.get("SCCACHE_BUCKET") }}
        SCCACHE_IDLE_TIMEOUT: ${{ env.get("SCCACHE_IDLE_TIMEOUT") }}
        SCCACHE_REGION: ${{ env.get("SCCACHE_REGION") }}
        SCCACHE_S3_USE_SSL: ${{ env.get("SCCACHE_S3_USE_SSL") }}
        SCCACHE_S3_NO_CREDENTIALS: ${{ env.get("SCCACHE_S3_NO_CREDENTIALS") }}
        SCCACHE_S3_KEY_PREFIX: libcuopt/${{ env.get("RAPIDS_CONDA_ARCH") }}/cuda${{ cuda_major }}

  requirements:
    build:
      - libboost-devel
      - ${{ compiler("c") }}
      - ${{ compiler("cxx") }}
      - ${{ compiler("cuda") }} =${{ cuda_version }}
      - ${{ stdlib("c") }}
      - cuda-version =${{ cuda_version }}
      - cmake ${{ cmake_version }}
      - ninja
      - git  # Required for FetchContent to clone gRPC
      - tbb-devel
      - zlib
      - bzip2
      # gRPC/Protobuf/Abseil are built from source via FetchContent to avoid
      # abseil-cpp#1624 (Mutex::Dtor not exported from shared libabseil on Linux)
    host:
      - cpp-argparse
      - cuda-version =${{ cuda_version }}
      - libraft-headers =${{ minor_version }}
      - librmm =${{ minor_version }}
      - rapids-logger =0.2
      - cuda-nvtx-dev
      - libcudss-dev >=0.7
      - libcurand-dev
      - libcusparse-dev
      - libboost-devel
      - tbb-devel
      - zlib
      - bzip2
      - openssl  # Required for gRPC SSL support
      - c-ares   # Required for gRPC (bundled c-ares incompatible with CMake 4.x)
      # gRPC/Protobuf/Abseil are built from source via FetchContent

outputs:
  - package:
      name: libmps-parser
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/libmps_parser/build
      dynamic_linking:
        overlinking_behavior: "error"
      prefix_detection:
        ignore:
          # See https://github.com/rapidsai/build-planning/issues/160
          - lib/libmps_parser.so
      string: ${{ date_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
        - ${{ stdlib("c") }}
        - zlib
        - bzip2
      host:
        - zlib
        - bzip2
      run:
        - zlib
        - bzip2
      ignore_run_exports:
        by_name:
          - cuda-nvtx
          - cuda-version
          - libcurand
          - libcudss
          - libcusparse
          - librmm
          - libzlib
          - libbz2
    tests:
    - package_contents:
        files:
          - lib/libmps_parser.so
    about:
      homepage: ${{ load_from_file("python/cuopt/cuopt/linear_programming/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/cuopt/linear_programming/pyproject.toml").project.license }}
      summary: ${{ load_from_file("python/cuopt/cuopt/linear_programming/pyproject.toml").project.description }}

  - package:
      name: libcuopt
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/build
      dynamic_linking:
        overlinking_behavior: "error"
      prefix_detection:
        ignore:
          # See https://github.com/rapidsai/build-planning/issues/160
          - lib/libcuopt.so
      string: cuda${{ cuda_major }}_${{ date_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
        - ${{ stdlib("c") }}
      host:
        - ${{ pin_subpackage("libmps-parser", exact=True) }}
        - libboost-devel
        - cuda-version =${{ cuda_version }}
        - rapids-logger =0.2
        - librmm =${{ minor_version }}
        - libcublas
        - libcudss-dev >=0.7
        - libcusparse-dev
        - openssl  # Required for gRPC SSL (built from source)
        - c-ares   # Required for gRPC DNS resolution
        # gRPC/Protobuf/Abseil are built from source via FetchContent
      run:
        - ${{ pin_compatible("cuda-version", upper_bound="x", lower_bound="x") }}
        - ${{ pin_subpackage("libmps-parser", exact=True) }}
        - libboost-devel
        - librmm =${{ minor_version }}
        - cuda-nvrtc
        - libcudss
        - openssl  # Required at runtime for gRPC SSL
        - c-ares   # Required at runtime for gRPC DNS
      ignore_run_exports:
        by_name:
          - cuda-nvtx
          - cuda-version
          - libcudss
          - libcurand
          - libcusparse
          - librmm
          - libboost
          - libboost_iostreams
    tests:
    - package_contents:
        files:
          - lib/libcuopt.so
          - bin/cuopt_cli
    about:
      homepage: ${{ load_from_file("python/cuopt/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/pyproject.toml").project.license }}
      summary: ${{ load_from_file("python/cuopt/pyproject.toml").project.description }}

  - package:
      name: libcuopt-tests
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/build --component testing
      dynamic_linking:
        overlinking_behavior: "error"
      string: cuda${{ cuda_major }}_${{ date_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
        - ${{ stdlib("c") }}
      host:
        - ${{ pin_subpackage("libcuopt", exact=True) }}
        - ${{ pin_subpackage("libmps-parser", exact=True) }}
        - libboost-devel
        - libcublas
        - libcudss-dev >=0.7
        - libcusparse-dev
      run:
        - ${{ pin_subpackage("libcuopt", exact=True) }}
        - ${{ pin_subpackage("libmps-parser", exact=True) }}
      ignore_run_exports:
        by_name:
          - cuda-nvtx
          - cuda-version
          - libcurand
          - libcusparse
          - libcudss
          - librmm
          - libboost
          - libboost_iostreams
    about:
      homepage: ${{ load_from_file("python/cuopt/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/pyproject.toml").project.license }}
      summary: libcuopt test & benchmark executables
