schema_version: 1

context:
  version: ${{ env.get("RAPIDS_PACKAGE_VERSION") }}
  minor_version: ${{ (version | split("."))[:2] | join(".") }}
  cuda_version: ${{ (env.get("RAPIDS_CUDA_VERSION") | split("."))[:2] | join(".") }}
  cuda_major: '${{ (env.get("RAPIDS_CUDA_VERSION") | split("."))[0] }}'
  datetime_string: '${{ env.get("RAPIDS_DATETIME_STRING") }}'
  head_rev: '${{ git.head_rev(".")[:8] }}'
  build_type: '${{ env.get("RAPIDS_BUILD_TYPE") }}'

recipe:
  name: libcuopt-split

cache:
  source:
    path: ../../..

  build:
    script:
      content: |
        # Remove `-fdebug-prefix-map` line from CFLAGS and CXXFLAGS so the
        # incrementing version number in the compile line doesn't break the
        # cache
        set -x
        export CFLAGS=$(echo $CFLAGS | sed -E 's@\-fdebug\-prefix\-map[^ ]*@@g')
        export CXXFLAGS=$(echo $CXXFLAGS | sed -E 's@\-fdebug\-prefix\-map[^ ]*@@g')
        set +x

        ./build.sh -v ${BUILD_EXTRA_FLAGS} libcuopt deb --allgpuarch --cmake-args=\"-DCMAKE_INSTALL_LIBDIR=lib -DBUILD_LP_BENCHMARKS=ON -DBUILD_MIP_BENCHMARKS=ON\"
      secrets:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - AWS_SESSION_TOKEN
        - SCCACHE_DIST_AUTH_TOKEN
      env:
        # Enable assertions (-a flag) for PR builds, but not for nightly or release builds
        BUILD_EXTRA_FLAGS: '${{ "-a --host-lineinfo" if build_type == "pull-request" else "" }}'
        CMAKE_C_COMPILER_LAUNCHER: ${{ env.get("CMAKE_C_COMPILER_LAUNCHER") }}
        CMAKE_CUDA_COMPILER_LAUNCHER: ${{ env.get("CMAKE_CUDA_COMPILER_LAUNCHER") }}
        CMAKE_CXX_COMPILER_LAUNCHER: ${{ env.get("CMAKE_CXX_COMPILER_LAUNCHER") }}
        CMAKE_GENERATOR: ${{ env.get("CMAKE_GENERATOR") }}
        NVCC_APPEND_FLAGS: ${{ env.get("NVCC_APPEND_FLAGS", default="") }}
        PARALLEL_LEVEL: ${{ env.get("PARALLEL_LEVEL", default="8") }}
        SCCACHE_BUCKET: ${{ env.get("SCCACHE_BUCKET", default="") }}
        SCCACHE_DIST_AUTH_TYPE: ${{ env.get("SCCACHE_DIST_AUTH_TYPE", default="token") }}
        SCCACHE_DIST_FALLBACK_TO_LOCAL_COMPILE: ${{ env.get("SCCACHE_DIST_FALLBACK_TO_LOCAL_COMPILE", default="false") }}
        SCCACHE_DIST_MAX_RETRIES: ${{ env.get("SCCACHE_DIST_MAX_RETRIES", default="inf") }}
        SCCACHE_DIST_REQUEST_TIMEOUT: ${{ env.get("SCCACHE_DIST_REQUEST_TIMEOUT", default="7140") }}
        SCCACHE_DIST_SCHEDULER_URL: ${{ env.get("SCCACHE_DIST_SCHEDULER_URL", default="") }}
        SCCACHE_ERROR_LOG: ${{ env.get("SCCACHE_ERROR_LOG", default="/tmp/sccache.log") }}
        SCCACHE_IDLE_TIMEOUT: ${{ env.get("SCCACHE_IDLE_TIMEOUT", default="0") }}
        SCCACHE_NO_CACHE: ${{ env.get("SCCACHE_NO_CACHE", default="") }}
        SCCACHE_RECACHE: ${{ env.get("SCCACHE_RECACHE", default="") }}
        SCCACHE_REGION: ${{ env.get("SCCACHE_REGION", default="") }}
        SCCACHE_S3_KEY_PREFIX: libcuopt/${{ env.get("RAPIDS_CONDA_ARCH") }}/cuda${{ cuda_major }}
        SCCACHE_S3_NO_CREDENTIALS: ${{ env.get("SCCACHE_S3_NO_CREDENTIALS", default="false") }}
        SCCACHE_S3_PREPROCESSOR_CACHE_KEY_PREFIX: libcuopt/${{ env.get("RAPIDS_CONDA_ARCH") }}/cuda${{ cuda_major }}/conda/preprocessor-cache
        SCCACHE_S3_USE_PREPROCESSOR_CACHE_MODE: ${{ env.get("SCCACHE_S3_USE_PREPROCESSOR_CACHE_MODE", default="true") }}
        SCCACHE_S3_USE_SSL: ${{ env.get("SCCACHE_S3_USE_SSL", default="true") }}
        SCCACHE_SERVER_LOG: ${{ env.get("SCCACHE_SERVER_LOG", default="sccache=debug") }}

  requirements:
    build:
      - libboost-devel
      - ${{ compiler("c") }}
      - ${{ compiler("cxx") }}
      - ${{ compiler("cuda") }} =${{ cuda_version }}
      - ${{ stdlib("c") }}
      - cuda-version =${{ cuda_version }}
      - cmake ${{ cmake_version }}
      - make
      - ninja
      - git
      - tbb-devel
      - zlib
      - bzip2
    host:
      - cpp-argparse
      - cuda-version =${{ cuda_version }}
      - libraft-headers =${{ minor_version }}
      - librmm =${{ minor_version }}
      - rapids-logger =0.3
      - cuda-nvtx-dev
      - libcudss-dev >=0.7,<0.8
      - libcusparse-dev
      - libnvjitlink-dev
      - libboost-devel
      - nccl >=2.19
      - tbb-devel
      - zlib
      - bzip2
      - openssl
      - c-ares
      - libgrpc >=1.78.0,<1.80.0a0
      - libprotobuf
      - libabseil
      - re2

outputs:
  # One output per component library. Each installs only its own install component,
  # so a routing-only install no longer pulls the LP solver or its cusparse / cudss /
  # nccl dependencies. See #1635.
  - package:
      name: libcuopt-client
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/build --component client
          cmake --install cpp/build --component client-dev
          # --require-leaf: the client must resolve without the GPU stack (#1890).
          ./ci/check_symbols.sh cpp/build/libcuopt_client.so --no-public-api-check --require-leaf
      dynamic_linking:
        overlinking_behavior: "error"
      prefix_detection:
        ignore:
          # See https://github.com/rapidsai/build-planning/issues/160
          - lib/libcuopt_client.so
      string: cuda${{ cuda_major }}_${{ datetime_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
        - ${{ stdlib("c") }}
        - binutils
      host:
        - cuda-version =${{ cuda_version }}
        - rapids-logger =0.3
        - librmm =${{ minor_version }}
        - openssl
        - c-ares
        - libuuid
        - libgrpc >=1.78.0,<1.80.0a0
        - libprotobuf
        - libabseil
        - re2
      run:
        - ${{ pin_compatible("cuda-version", upper_bound="x", lower_bound="x") }}
        - librmm =${{ minor_version }}
        - openssl
        - c-ares
        - libuuid
        - libgrpc >=1.78.0,<1.80.0a0
        - libprotobuf
        - libabseil
      ignore_run_exports:
        # Every output inherits the run exports of the shared build cache, whose host
        # holds the union of all three components' dependencies. The CUDA math libs
        # export a `>=<built minor>` bound that drags `cuda-version` to the minor
        # version the package happened to be built against, so they have to be dropped
        # from outputs that do not link them.
        by_name:
          - cuda-nvtx
          - cuda-version
          - libboost
          - libboost_iostreams
          - libcudss
          - libcusparse
          - librmm
    tests:
      - package_contents:
          files:
            - lib/libcuopt_client.so
            - include/cuopt/error.hpp
            - include/cuopt/export.hpp
      # Loads the library in an environment holding only this package and its declared
      # dependencies, with RTLD_NOW so every relocation has to resolve. A component that
      # quietly needs another engine fails here rather than passing because some other
      # package happened to pull it in.
      - script: |
          python -c "import ctypes, os; ctypes.CDLL(os.path.join(os.environ['PREFIX'], 'lib', 'libcuopt_client.so'), os.RTLD_NOW)"
        requirements:
          run:
            - python
    about:
      homepage: ${{ load_from_file("python/cuopt/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/pyproject.toml").project.license }}
      summary: cuOpt host-side client -- problem representation, parsers and gRPC client

  - package:
      name: libcuopt-mathopt
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/build --component mathopt
          cmake --install cpp/build --component mathopt-dev
          ./ci/check_symbols.sh cpp/build/libcuopt_mathopt.so
      dynamic_linking:
        overlinking_behavior: "error"
      prefix_detection:
        ignore:
          - lib/libcuopt_mathopt.so
      string: cuda${{ cuda_major }}_${{ datetime_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
        - ${{ stdlib("c") }}
        - binutils
      host:
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - libboost-devel
        - cuda-version =${{ cuda_version }}
        - rapids-logger =0.3
        - librmm =${{ minor_version }}
        - libcublas
        - libcudss-dev >=0.7,<0.8
        - libcusparse-dev
        - libnvjitlink-dev
        - nccl >=2.19
        - tbb-devel
      run:
        - ${{ pin_compatible("cuda-version", upper_bound="x", lower_bound="x") }}
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - libboost-devel
        - librmm =${{ minor_version }}
        - cuda-nvrtc
        - libcublas
        - libcudss >=0.7,<0.8
        - libcusparse
        - libgomp >=9
        - nccl >=2.19
        - tbb
      ignore_run_exports:
        by_name:
          - cuda-nvtx
          - cuda-version
          - libcudss
          - libcusparse
          - librmm
          - libboost
          - libboost_iostreams
    tests:
      - package_contents:
          files:
            - lib/libcuopt_mathopt.so
            - bin/cuopt_cli
      # Loads the library in an environment holding only this package and its declared
      # dependencies, with RTLD_NOW so every relocation has to resolve. A component that
      # quietly needs another engine fails here rather than passing because some other
      # package happened to pull it in.
      - script: |
          python -c "import ctypes, os; ctypes.CDLL(os.path.join(os.environ['PREFIX'], 'lib', 'libcuopt_mathopt.so'), os.RTLD_NOW)"
        requirements:
          run:
            - python
    about:
      homepage: ${{ load_from_file("python/cuopt/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/pyproject.toml").project.license }}
      summary: cuOpt LP / MILP / QP / SOCP solver

  - package:
      name: libcuopt-routing
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/build --component routing
          cmake --install cpp/build --component routing-dev
          ./ci/check_symbols.sh cpp/build/libcuopt_routing.so --no-public-api-check
      dynamic_linking:
        overlinking_behavior: "error"
      prefix_detection:
        ignore:
          - lib/libcuopt_routing.so
      string: cuda${{ cuda_major }}_${{ datetime_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
        - ${{ stdlib("c") }}
        - binutils
      host:
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - libboost-devel
        - cuda-version =${{ cuda_version }}
        - rapids-logger =0.3
        - librmm =${{ minor_version }}
        - libcublas
      run:
        - ${{ pin_compatible("cuda-version", upper_bound="x", lower_bound="x") }}
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - libboost-devel
        - librmm =${{ minor_version }}
        # Reaches routing through cuDSS today, whose run export the cache leaks into
        # every output. Routing does not use cuDSS, so it has to name cuBLAS itself.
        - libcublas
      ignore_run_exports:
        by_name:
          - cuda-nvtx
          - cuda-version
          - libboost
          - libboost_iostreams
          - libcudss
          - libcusparse
          - librmm
    tests:
      - package_contents:
          files:
            - lib/libcuopt_routing.so
      # Loads the library in an environment holding only this package and its declared
      # dependencies, with RTLD_NOW so every relocation has to resolve. A component that
      # quietly needs another engine fails here rather than passing because some other
      # package happened to pull it in.
      - script: |
          python -c "import ctypes, os; ctypes.CDLL(os.path.join(os.environ['PREFIX'], 'lib', 'libcuopt_routing.so'), os.RTLD_NOW)"
        requirements:
          run:
            - python
    about:
      homepage: ${{ load_from_file("python/cuopt/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/pyproject.toml").project.license }}
      summary: cuOpt VRP / TSP / PDP routing engine

  # The server is the one artifact that needs every engine, and it is a separately-run
  # service with its own lifecycle, so it ships on its own rather than forcing every
  # library user to install a daemon.
  - package:
      name: cuopt-grpc-server
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/build --component grpc-server
      dynamic_linking:
        overlinking_behavior: "error"
      string: cuda${{ cuda_major }}_${{ datetime_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
        - ${{ stdlib("c") }}
      host:
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - ${{ pin_subpackage("libcuopt-mathopt", exact=True) }}
        - ${{ pin_subpackage("libcuopt-routing", exact=True) }}
        - cuda-version =${{ cuda_version }}
      run:
        - ${{ pin_compatible("cuda-version", upper_bound="x", lower_bound="x") }}
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - ${{ pin_subpackage("libcuopt-mathopt", exact=True) }}
        - ${{ pin_subpackage("libcuopt-routing", exact=True) }}
      ignore_run_exports:
        by_name:
          - cuda-nvtx
          - cuda-version
          - libboost
          - libboost_iostreams
          - libcudss
          - libcusparse
          - librmm
    tests:
      - package_contents:
          files:
            - bin/cuopt_grpc_server
      # --help exits without binding a port, so this only proves the binary starts:
      # it resolves all three component libraries from its own dependencies.
      - script: |
          cuopt_grpc_server --help
    about:
      homepage: ${{ load_from_file("python/cuopt/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/pyproject.toml").project.license }}
      summary: cuOpt gRPC remote solve server

  # Keeps `conda install libcuopt` working for anyone who wants the whole library, and
  # carries libcuopt.so -- the ld script names all three components, so it is only
  # resolvable where all three are installed.
  - package:
      name: libcuopt
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/build --component dev
          # rapids_export puts cuopt-config.cmake and the export set in a component named
          # after the project, so find_package(cuopt) breaks without this.
          cmake --install cpp/build --component cuopt
      string: cuda${{ cuda_major }}_${{ datetime_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
      host:
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - ${{ pin_subpackage("libcuopt-mathopt", exact=True) }}
        - ${{ pin_subpackage("libcuopt-routing", exact=True) }}
        - ${{ pin_subpackage("cuopt-grpc-server", exact=True) }}
      run:
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - ${{ pin_subpackage("libcuopt-mathopt", exact=True) }}
        - ${{ pin_subpackage("libcuopt-routing", exact=True) }}
        - ${{ pin_subpackage("cuopt-grpc-server", exact=True) }}
      ignore_run_exports:
        # This output ships the linker script, the headers and the cmake config -- no
        # compiled object, so it links nothing and the three components carry every
        # real dependency. Left alone it would still inherit the whole build cache's
        # run exports, including `cuda-version >=<built minor>`, which would pin
        # `conda install libcuopt` to the CUDA minor version it was built against.
        by_name:
          - bzip2
          - c-ares
          - cuda-nvtx
          - cuda-version
          - libabseil
          - libboost
          - libboost_iostreams
          - libcudss
          - libcusparse
          - libgrpc
          - libnvjitlink
          - libprotobuf
          - libre2-11
          - librmm
          - libzlib
          - nccl
          - openssl
          - re2
          - tbb
    tests:
      - package_contents:
          files:
            - lib/libcuopt.so
    about:
      homepage: ${{ load_from_file("python/cuopt/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/pyproject.toml").project.license }}
      summary: ${{ load_from_file("python/cuopt/pyproject.toml").project.description }}

  - package:
      name: libcuopt-tests
      version: ${{ version }}
    build:
      script:
        content: |
          cmake --install cpp/build --component testing
      dynamic_linking:
        overlinking_behavior: "error"
      string: cuda${{ cuda_major }}_${{ datetime_string }}_${{ head_rev }}
    requirements:
      build:
        - cmake ${{ cmake_version }}
        - ${{ stdlib("c") }}
      host:
        # libcuopt for the ld script that the tests linking -lcuopt need, and the three
        # components explicitly: the test binaries link them directly, so relying on the
        # metapackage's run deps to drag them in would be implicit.
        - ${{ pin_subpackage("libcuopt", exact=True) }}
        - ${{ pin_subpackage("libcuopt-client", exact=True) }}
        - ${{ pin_subpackage("libcuopt-mathopt", exact=True) }}
        - ${{ pin_subpackage("libcuopt-routing", exact=True) }}
        - libboost-devel
        - libcublas
        - libcudss-dev >=0.7,<0.8
        - libcusparse-dev
        - nccl >=2.19
        - openssl
        - c-ares
        - libgrpc >=1.78.0,<1.80.0a0
        - libprotobuf
        - libabseil
      run:
        - ${{ pin_subpackage("libcuopt", exact=True) }}
      ignore_run_exports:
        by_name:
          - cuda-nvtx
          - cuda-version
          - libcusparse
          - libcudss
          - librmm
          - libboost
          - libboost_iostreams
    about:
      homepage: ${{ load_from_file("python/cuopt/pyproject.toml").project.urls.Homepage }}
      license: ${{ load_from_file("python/cuopt/pyproject.toml").project.license }}
      summary: libcuopt test & benchmark executables
