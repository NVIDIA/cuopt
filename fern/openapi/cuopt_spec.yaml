components:
  schemas:
    DeleteRequestModel:
      properties:
        queued:
          type: integer
          title: Queued
          description: Number of queued jobs that were deleted.
        running:
          type: integer
          title: Running
          description: Number of running jobs that were deleted.
        cached:
          type: integer
          title: Cached
          description: Number of cached jobs that were deleted.
      additionalProperties: false
      type: object
      required:
      - queued
      - running
      - cached
      title: DeleteRequestModel
    DetailModel:
      properties:
        error:
          type: string
          title: Error
          description: Error details
        error_result:
          type: boolean
          title: Error Result
          description: Whether or not the error is a result from the solver
      type: object
      required:
      - error
      - error_result
      title: DetailModel
    DroppedTasks:
      properties:
        task_id:
          anyOf:
          - items:
              type: integer
            type: array
          - items:
              type: string
            type: array
          title: Task Id
          description: With prize collection enabled, there is a chance of tasks being
            dropped to make a feasible solution. This list contains infeasible task
            ids which are dropped.
          default: []
        task_index:
          items:
            type: integer
          type: array
          title: Task Index
          description: With prize collection enabled, there is a chance of tasks being
            dropped to make a feasible solution. This list contains infeasible task
            indices into task locations which are dropped.
          default: []
      additionalProperties: false
      type: object
      title: DroppedTasks
    EmptyResponseModel:
      properties: {}
      additionalProperties: false
      type: object
      title: EmptyResponseModel
    FeasibleResultData:
      properties:
        status:
          type: integer
          title: Status
          description: "0 - Solution is available \n1 - Infeasible solution is available\
            \ \n"
          default: 0
          examples:
          - 0
        num_vehicles:
          type: integer
          title: Num Vehicles
          description: Number of vehicle being used for the solution
          default: -1
          examples:
          - 2
        solution_cost:
          type: number
          title: Solution Cost
          description: Total cost of the solution
          default: -1.0
          examples:
          - 2
        objective_values:
          additionalProperties:
            type: number
          type: object
          title: Objective Values
          description: Individual objective values
          default: {}
          examples:
          - objective_values:
              cost: 100.0
              prize: -1000.0
              travel_time: 245.0
        vehicle_data:
          additionalProperties:
            $ref: '#/components/schemas/VehicleData'
          type: object
          title: Vehicle Data
          description: All the details of vehicle routes and timestamps
          default: {}
          examples:
          - vehicle_data:
              veh-1:
                arrival_stamp:
                - 1
                - 2
                route:
                - 1
                - 1
                task_id:
                - Break
                - Task-A
                type:
                - Break
                - Delivery
              veh-2:
                arrival_stamp:
                - 2
                - 2
                - 4
                - 5
                route:
                - 0
                - 0
                - 2
                - 0
                task_id:
                - Depot
                - Break
                - Task-B
                - Depot
                type:
                - Depot
                - Break
                - Delivery
                - Depot
        initial_solutions:
          items:
            type: string
          type: array
          title: Initial Solutions
          description: Indicates whether each initial solution was accepted, not accepted
            or not evaluated by the solver in case initial solutions were provided
            in request.
          default: []
        dropped_tasks:
          $ref: '#/components/schemas/DroppedTasks'
          description: Contains details of dropped tasks when prize collection is
            enabled
          default: []
        msg:
          anyOf:
          - type: string
          - type: 'null'
          title: Msg
          description: Any information pertaining to the run.
          default: ''
      additionalProperties: false
      type: object
      title: FeasibleResultData
    FeasibleSolve:
      properties:
        solver_response:
          $ref: '#/components/schemas/FeasibleResultData'
          description: Feasible solution
          default:
            status: 0
            num_vehicles: -1
            solution_cost: -1.0
            objective_values: {}
            vehicle_data: {}
            initial_solutions: []
            dropped_tasks: []
            msg: ''
        perf_times:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Perf Times
          description: Etl and Solve times of the solve call
      additionalProperties: false
      type: object
      title: FeasibleSolve
    HealthResponseModel:
      properties:
        status:
          type: string
          title: Status
          description: The status of the service. RUNNING is normal.
        version:
          type: string
          title: Version
          description: The version of the service.
      additionalProperties: false
      type: object
      required:
      - status
      - version
      title: HealthResponseModel
    IdModel:
      properties:
        reqId:
          type: string
          title: Reqid
          description: Id to poll for result
          example: 074b8649-19b8-4264-ae9f-461ef1c67e05
      additionalProperties: false
      type: object
      required:
      - reqId
      title: IdModel
    InFeasibleSolve:
      properties:
        solver_infeasible_response:
          $ref: '#/components/schemas/InfeasibleResultData'
          description: Infeasible solution, this can mean the problem itself is infeasible
            or solver requires more time to find a solution. Setting default solve
            time is suggested in case you are not aware of the expected time.
          default:
            status: 1
            num_vehicles: -1
            solution_cost: -1.0
            objective_values: {}
            vehicle_data: {}
            initial_solutions: []
            dropped_tasks: []
            msg: ''
        perf_times:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Perf Times
          description: Etl and Solve times of the solve call
      additionalProperties: false
      type: object
      title: InFeasibleSolve
    IncumbentSolution:
      properties:
        solution:
          items:
            type: number
          type: array
          title: Solution
        cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Cost
        bound:
          anyOf:
          - type: number
          - type: 'null'
          title: Bound
      additionalProperties: false
      type: object
      required:
      - solution
      - cost
      - bound
      title: IncumbentSolution
    InfeasibleResultData:
      properties:
        status:
          type: integer
          title: Status
          description: "1 - Infeasible solution is available \n"
          default: 1
          examples:
          - 1
        num_vehicles:
          type: integer
          title: Num Vehicles
          description: Number of vehicle being used for the solution
          default: -1
          examples:
          - 2
        solution_cost:
          type: number
          title: Solution Cost
          description: Total cost of the solution
          default: -1.0
          examples:
          - 2
        objective_values:
          additionalProperties:
            type: number
          type: object
          title: Objective Values
          description: Individual objective values
          default: {}
          examples:
          - objective_values:
              cost: 100.0
              prize: -1000.0
              travel_time: 245.0
        vehicle_data:
          additionalProperties:
            $ref: '#/components/schemas/VehicleData'
          type: object
          title: Vehicle Data
          description: All the details of vehicle routes and timestamps
          default: {}
          examples:
          - vehicle_data:
              veh-1:
                arrival_stamp:
                - 1
                - 2
                route:
                - 1
                - 1
                task_id:
                - Break
                - Task-A
                type:
                - Break
                - Delivery
              veh-2:
                arrival_stamp:
                - 2
                - 2
                - 4
                - 5
                route:
                - 0
                - 0
                - 2
                - 0
                task_id:
                - Depot
                - Break
                - Task-B
                - Depot
                type:
                - Depot
                - Break
                - Delivery
                - Depot
        initial_solutions:
          items:
            type: string
          type: array
          title: Initial Solutions
          description: Indicates whether each initial solution was accepted, not accepted
            or not evaluated by the solver in case initial solutions were provided
            in request.
          default: []
        dropped_tasks:
          $ref: '#/components/schemas/DroppedTasks'
          description: 'Note: This is just a place holder since there will not be
            any dropped tasks in infeasible solution.Contains details of dropped tasks
            when prize collection is enabled.'
          default: []
        msg:
          anyOf:
          - type: string
          - type: 'null'
          title: Msg
          description: Any information pertaining to the run.
          default: ''
      additionalProperties: false
      type: object
      title: InfeasibleResultData
    LPSolve:
      properties:
        solver_response:
          anyOf:
          - $ref: '#/components/schemas/SolutionResultData'
          - items:
              $ref: '#/components/schemas/SolutionResultData'
            type: array
          title: Solver Response
          description: LP solution
          default:
            status: NoTermination
            solution:
              dual_solution: []
              lp_statistics: {}
              milp_statistics: {}
              primal_solution: []
              vars: {}
        perf_times:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Perf Times
          description: Etl and Solve times of the solve call
        total_solve_time:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Solve Time
          description: Total Solve time of batch problem
      additionalProperties: false
      type: object
      title: LPSolve
    LocationTypeEnum:
      type: string
      enum:
      - Depot
      - Pickup
      - Delivery
      - Break
      - w
      title: LocationTypeEnum
    LogResponseModel:
      properties:
        log:
          items:
            type: string
          type: array
          title: Log
        nbytes:
          type: integer
          title: Nbytes
      additionalProperties: false
      type: object
      required:
      - log
      - nbytes
      title: LogResponseModel
    RequestStatusModel:
      type: string
      enum:
      - completed
      - aborted
      - running
      - queued
      title: RequestStatusModel
    SolutionData:
      properties:
        problem_category:
          type: integer
          title: Problem Category
          description: Category of the solution, LP-0/MIP-1/IP-2
        primal_solution:
          items:
            type: number
          type: array
          title: Primal Solution
          description: Primal solution of the LP problem
          default: []
        dual_solution:
          items:
            type: number
          type: array
          title: Dual Solution
          description: "Note: Only applicable to LP \nDual solution of the LP problem\n"
          default: []
        solver_time:
          type: number
          title: Solver Time
          description: Returns the engine solve time in seconds
        solved_by:
          type: integer
          title: Solved By
          description: Returns whether problem was solved by PDLP, Barrier or Dual
            Simplex
        primal_objective:
          type: number
          title: Primal Objective
          description: Primal objective of the LP problem
        dual_objective:
          type: number
          title: Dual Objective
          description: "Note: Only applicable to LP \nDual objective of the LP problem\
            \ \n"
        vars:
          additionalProperties: true
          type: object
          title: Vars
          description: Dictionary mapping each variable (name) to its value
          default: {}
        lp_statistics:
          additionalProperties: true
          type: object
          title: Lp Statistics
          description: "Note: Only applicable to LP \nConvergence statistics of the\
            \ solution \nIncludes primal residual, dual residual, \nreduced cost and\
            \ gap \n"
          default: {}
        milp_statistics:
          additionalProperties: true
          type: object
          title: Milp Statistics
          description: "Note: Only applicable to MILP \nConvergence statistics of\
            \ the solution \nIncludes mip gap, solution_bound, pre-solve time, \n\
            max_constraint_violation, max_int_violatione and \n max_variable_bound_violation\
            \ \n"
          default: {}
      additionalProperties: false
      type: object
      title: SolutionData
    SolutionModelInFile:
      properties:
        result_file:
          type: string
          title: Result File
          description: result_file is a file path to result
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          description: List of warnings for users to handle issues
          default: []
        notes:
          items:
