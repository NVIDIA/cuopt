                      indices, offsets and values are shared in this matrix.


                      Offsets depict number of coefficients/values for each constraint.

                      Indices signify variable with which the coefficients/values
                      are associated.

                      And coefficients 3, 4, 2.7, 10.1 become values.


                      For more details please refer here <https://docs.nvidia.com/nvpl/_static/sparse/storage_format/sparse_matrix.html#compressed-sparse-row-csr>
