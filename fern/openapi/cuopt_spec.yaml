openapi: 3.1.0
info:
  title: cuOpt Server
  summary: OpenAPI Specification for cuOpt
  version: '26.08'
paths:
  /v2/health/live:
    get:
      summary: Health
      description: To check liveness of the server
      operationId: health_v2_health_live_get
      responses:
        '200':
          description: Successful health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseModel'
              examples:
                Healthy response:
                  value:
                    status: RUNNING
                    version: '26.08'
        '500':
          description: Unsuccessful health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
              examples:
                Unhealthy response:
                  value:
                    error: '

                      Status : Broken

                      The server will be restarted and will be available in 15 mins
                      !!!

                      ERROR : Server is BROKEN'
  /v2/health/ready:
    get:
      summary: Health
      description: To check readiness of the server
      operationId: health_v2_health_ready_get
      responses:
        '200':
          description: Successful health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseModel'
              examples:
                Healthy response:
                  value:
                    status: RUNNING
                    version: '26.08'
        '500':
          description: Unsuccessful health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
              examples:
                Unhealthy response:
                  value:
                    error: '

                      Status : Broken

                      The server will be restarted and will be available in 15 mins
                      !!!

                      ERROR : Server is BROKEN'
  /cuopt/health:
    get:
      summary: Health
      description: To ping if server is running
      operationId: health_cuopt_health_get
      responses:
        '200':
          description: Successful health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseModel'
              examples:
                Healthy response:
                  value:
                    status: RUNNING
                    version: '26.08'
        '500':
          description: Unsuccessful health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
              examples:
                Unhealthy response:
                  value:
                    error: '

                      Status : Broken

                      The server will be restarted and will be available in 15 mins
                      !!!

                      ERROR : Server is BROKEN'
  /:
    get:
      summary: Health
      description: To ping if server is running
      operationId: health__get
      responses:
        '200':
          description: Successful health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseModel'
              examples:
                Healthy response:
                  value:
                    status: RUNNING
                    version: '26.08'
        '500':
          description: Unsuccessful health check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
              examples:
                Unhealthy response:
                  value:
                    error: '

                      Status : Broken

                      The server will be restarted and will be available in 15 mins
                      !!!

                      ERROR : Server is BROKEN'
  /cuopt/log/{id}:
    get:
      summary: Query solver logs by id self-hosted
      description: 'Note: This is for self-hosted. Query solver log. The ''id'' is
        the uuid returned when the request was made.'
      operationId: getsolverlogs_cuopt_log__id__get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: frombyte
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Indicates the position to start log read
          default: 0
          title: Frombyte
        description: Indicates the position to start log read
      - name: accept
        in: header
        required: false
        schema:
          type: string
          description: 'Supported result mime_types are ''application/json'', ''application/vnd.msgpack'',
            ''application/zlib'', and standard mime_type wildcards. '
          default: application/json
          title: Accept
        description: 'Supported result mime_types are ''application/json'', ''application/vnd.msgpack'',
          ''application/zlib'', and standard mime_type wildcards. '
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogResponseModel'
        '415':
          description: Unsupported mime_type specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '422':
          description: Unprocessable Entity or Runtime Error or Out of memory error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '500':
          description: Any uncaught cuOpt error or Server errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
    delete:
      summary: Delete solver logs by id (self-hosted)
      description: 'Note: This is for self-hosted. Delete accumulated logs for a particular
        request.'
      operationId: deletesolverlogs_cuopt_log__id__delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: accept
        in: header
        required: false
        schema:
          type: string
          description: Supported result mime_types are 'application/json', 'application/vnd.msgpack',
            'application/zlib', and standard mime_type wildcards. This applies to
            exception messages returned by this request.
          default: application/json
          title: Accept
        description: Supported result mime_types are 'application/json', 'application/vnd.msgpack',
          'application/zlib', and standard mime_type wildcards. This applies to exception
          messages returned by this request.
      responses:
        '200':
          description: Successful request response (no content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponseModel'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '500':
          description: Any uncaught cuOpt error or Server errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
  /cuopt/solution/{id}/incumbents:
    get:
      summary: Get incumbent solutions for MIP (self-hosted)
      description: 'Note: for use with self-hosted cuOpt instances. Return incumbent
        solutions from the MIP solver produced for this id since the last GET. Result
        will be a list of the form [{''solution'': [1.0, 1.0], ''cost'': 2.0, ''bound'':
        1.5}] where each item contains the fields ''solution'' (a list of floats),
        ''cost'' (a float), and ''bound'' (a float or None when no finite bound is
        available yet). An empty list indicates that there are no current incumbent
        solutions at this time. A sentinel value of [{''solution'': [], ''cost'':
        None, ''bound'': None}] indicates that no future incumbent values will be
        produced. The ''id'' is the reqId value returned from a POST to /cuopt/request'
      operationId: getincumbent_cuopt_solution__id__incumbents_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: accept
        in: header
        required: false
        schema:
          type: string
          description: Supported result mime_types are 'application/json', 'application/vnd.msgpack',
            'application/zlib', and standard mime_type wildcards. If a wildcard is
            used, the accept mime_type will be set to the content_type mime_type of
            the original request.
          default: application/json
          title: Accept
        description: Supported result mime_types are 'application/json', 'application/vnd.msgpack',
          'application/zlib', and standard mime_type wildcards. If a wildcard is used,
          the accept mime_type will be set to the content_type mime_type of the original
          request.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncumbentSolution'
                title: Response Getincumbent Cuopt Solution  Id  Incumbents Get
              examples:
                Empty response (no current solutions):
                  value: []
                Sentinel response (no future solutions).:
                  value:
                  - solution: []
                    cost: value will be 'null' but openapi docs will not display it
                Solution response:
                  value:
                  - solution:
                    - 1.0
                    - 2.0
                    cost: 3.0
                  - solution:
                    - 4.0
                    - 5.0
                    cost: 6.0
        '415':
          description: Unsupported mime_type specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '422':
          description: Unprocessable Entity or Runtime Error or Out of memory error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '500':
          description: Any uncaught cuOpt error or Server errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
  /cuopt/solution:
    post:
      summary: Upload a routing solution only(self-hosted)
      description: 'Note: for use with self-hosted cuOpt instances. Accepts a cuOpt
        solution and returns a reqId. This is useful for uploading a VRP solution
        to use as an initial solution for another request.'
      operationId: postsolution_cuopt_solution_post
      parameters:
      - name: accept
        in: header
        required: false
        schema:
          type: string
          description: Supported result mime_types are 'application/json', 'application/vnd.msgpack',
            'application/zlib', and standard mime_type wildcards. If a wildcard is
            used, the accept mime_type will be set to the content_type mime_type
          default: application/json
          title: Accept
        description: Supported result mime_types are 'application/json', 'application/vnd.msgpack',
          'application/zlib', and standard mime_type wildcards. If a wildcard is used,
          the accept mime_type will be set to the content_type mime_type
      - name: content-type
        in: header
        required: false
        schema:
          type: string
          description: Supported content mime_types are 'application/json', 'application/vnd.msgpack',
            and 'application/zlib'
          default: application/json
          title: Content-Type
        description: Supported content mime_types are 'application/json', 'application/vnd.msgpack',
          and 'application/zlib'
      - name: content-length
        in: header
        required: true
        schema:
          type: integer
          title: Content-Length
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdModel'
              examples:
                Id response:
                  value:
                    reqId: e8421e9e-e42e-4511-8da2-314253667dcf
        '400':
          description: Value Error Or Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '415':
          description: Unsupported mime_type specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '422':
          description: Unprocessable Entity or Runtime Error or Out of memory error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
        '500':
          description: Any uncaught cuOpt error or Server errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailModel'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                response:
                  anyOf:
                  - additionalProperties: false
                    properties:
                      solver_response:
                        additionalProperties: false
                        properties:
                          status:
                            default: 0
                            description: "0 - Solution is available \n1 - Infeasible\
                              \ solution is available \n"
                            examples:
                            - 0
                            title: Status
                            type: integer
                          num_vehicles:
                            default: -1
                            description: Number of vehicle being used for the solution
                            examples:
                            - 2
                            title: Num Vehicles
                            type: integer
                          solution_cost:
                            default: -1.0
                            description: Total cost of the solution
                            examples:
                            - 2
                            title: Solution Cost
                            type: number
                          objective_values:
                            additionalProperties:
                              type: number
                            default: {}
                            description: Individual objective values
                            examples:
                            - objective_values:
                                cost: 100.0
                                prize: -1000.0
                                travel_time: 245.0
                            title: Objective Values
                            type: object
                          vehicle_data:
                            additionalProperties:
                              additionalProperties: false
                              properties:
                                task_id:
                                  default: []
                                  description: task_ids being assigned to vehicle
                                    along with depot and breaks
                                  items:
                                    type: string
                                  title: Task Id
                                  type: array
                                arrival_stamp:
                                  default: []
                                  description: arrival stamps at each task locations
                                  items:
                                    type: number
                                  title: Arrival Stamp
                                  type: array
                                route:
                                  default: []
                                  description: Route indices as per waypoint graph
                                    or cost matrix provided
                                  items:
                                    type: integer
                                  title: Route
                                  type: array
                                type:
                                  default: []
                                  description: "Type of routing point, whether it\
                                    \ is Depot, Waypoint - w \nDelivery, Break, Pickup\
                                    \ \n"
                                  items:
                                    enum:
                                    - Depot
                                    - Pickup
                                    - Delivery
                                    - Break
                                    - w
                                    title: LocationTypeEnum
                                    type: string
                                  title: Type
                                  type: array
                              title: VehicleData
                              type: object
                            default: {}
                            description: All the details of vehicle routes and timestamps
                            examples:
                            - vehicle_data:
                                veh-1:
                                  arrival_stamp:
                                  - 1
                                  - 2
                                  route:
                                  - 1
                                  - 1
                                  task_id:
                                  - Break
                                  - Task-A
                                  type:
                                  - Break
                                  - Delivery
                                veh-2:
                                  arrival_stamp:
                                  - 2
                                  - 2
                                  - 4
                                  - 5
                                  route:
                                  - 0
                                  - 0
                                  - 2
                                  - 0
                                  task_id:
                                  - Depot
                                  - Break
                                  - Task-B
                                  - Depot
                                  type:
                                  - Depot
                                  - Break
                                  - Delivery
                                  - Depot
                            title: Vehicle Data
                            type: object
                          initial_solutions:
                            default: []
                            description: Indicates whether each initial solution was
                              accepted, not accepted or not evaluated by the solver
                              in case initial solutions were provided in request.
                            items:
                              type: string
                            title: Initial Solutions
                            type: array
