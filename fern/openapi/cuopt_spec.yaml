                          \ \n\n  \n\n In case, there are 2 vehicles and each of them\
                          \ have different service times, \n\n     { \n\n        \
                          \ vehicle-id-1: [tsk_1_veh_1_srv_time, tsk_2_veh_1_srv_time,\
