                          description: Set True to write logs to console, False to
                            not write logs to console.
                          title: Log To Console
                        strict_infeasibility:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                          default: false
                          description: ' controls the strict infeasibility mode in
                            PDLP. When true if either the current or the average solution
                            is detected as infeasible, PDLP will stop. When false
                            both the current and average solution need to be detected
                            as infeasible for PDLP to stop.'
                          title: Strict Infeasibility
                        user_problem_file:
                          anyOf:
                          - type: string
                          - type: 'null'
                          default: ''
                          description: Ignored by the service but included for dataset
                            compatibility
                          title: User Problem File
                        per_constraint_residual:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                          default: false
                          description: Controls whether PDLP should compute the primal
                            & dual residual per constraint instead of globally.
                          title: Per Constraint Residual
                        save_best_primal_so_far:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                          default: false
                          description: controls whether PDLP should save the best
                            primal solution so far. With this parameter set to true,
                            PDLP will always prioritize a primal feasible to a non
                            primal feasible. If a new primal feasible is found, the
                            one with the best primal objective will be kept. If no
                            primal feasible was found, the one with the lowest primal
                            residual will be kept. If two have the same primal residual,
                            the one with the best objective will be kept.
                          title: Save Best Primal So Far
                        first_primal_feasible:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                          default: false
                          description: Controls whether PDLP should stop when the
                            first primal feasible solution is found.
                          title: First Primal Feasible
                        log_file:
                          anyOf:
                          - type: string
                          - type: 'null'
                          default: ''
                          description: Ignored by the service but included for dataset
                            compatibility
                          title: Log File
                        solution_file:
                          anyOf:
                          - type: string
                          - type: 'null'
                          default: ''
                          description: Ignored by the service but included for dataset
                            compatibility
