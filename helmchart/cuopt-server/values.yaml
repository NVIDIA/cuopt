# Default values for cuopt-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nvidia/cuopt
  pullPolicy: IfNotPresent
  tag: "26.10.0-cuda12.9-py3.12"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: cuopt-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: cuopt-server-tls
  #    hosts:
  #      - cuopt-server.local

resources:
  limits:
    nvidia.com/gpu: 1

  requests:
    nvidia.com/gpu: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector:
  # Uncomment to schedule on nodes with GPU
  # accelerator: nvidia-tesla-k80

tolerations: []

affinity: {}

# Kubernetes command replaces the image ENTRYPOINT. Leave this empty so
# /opt/cuopt/entrypoint.sh runs. Do not set it to ["proxy"], ["grpc"], or
# ["legacy"]: the container would try to execute a program by that name.
command: []

# Arguments passed to the image entrypoint (Kubernetes args). This does not
# replace the entrypoint. Do not put a mode name here.
args: []

# Extra environment variables. The chart does not set a server mode; the
# image entrypoint does. Override that with CUOPT_SERVER_TYPE when needed:
# env:
#   - name: CUOPT_SERVER_TYPE
#     value: legacy   # or grpc, or proxy
env: []

# Persistent storage (if needed)
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  # storageClass: ""
